<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erfolgsjournal</title>
<meta name="theme-color" content="#1c2230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f2; --panel:#ffffff; --ink:#2a2620; --muted:#8a8178; --line:#ece4da;
  --accent:#e8774a; --accent-soft:#fde8dc; --ok:#4f9d69; --slip:#d9776b;
  --side:#2a2620; --side-ink:#f4ede4; --r:16px;
}
body.p-tag{--accent:#2f8fd1;--accent-soft:#e2f1fb;--bg:#f5f9fc}
body.p-abend{--accent:#c2527a;--accent-soft:#f8e1ea;--bg:#faf5f7}
body.p-nacht{--accent:#6b7fd7;--accent-soft:#e6e9fa;--bg:#f3f4f9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .6s}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
.app{display:flex;min-height:100vh}
nav.side{width:232px;background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.brand-mark{width:34px;height:34px;border-radius:10px;overflow:hidden;flex-shrink:0;position:relative}
.brand-mark svg{position:absolute;inset:0;width:100%;height:100%}
.brand b{font-family:Fraunces,serif;font-size:18px}
.brand small{display:block;color:#a99f93;font-size:11px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8f857a;padding:14px 12px 6px}
.nav-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14.5px;color:#d9d0c5;transition:.15s}
.nav-btn svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-btn:hover{background:#3a352e;color:#fff}
.nav-btn.active{background:var(--accent);color:#fff}
.side-foot{margin-top:auto;font-size:11.5px;color:#8f857a;padding:10px 12px;line-height:1.5}
main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1100px}
.hero{position:relative;border-radius:22px;overflow:hidden;height:200px;margin-bottom:20px;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero-txt{position:absolute;left:28px;bottom:22px;right:28px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.hero-txt .date{font-size:13px;opacity:.9}
.hero-txt h1{font-size:34px;margin:4px 0 0}
.phase-switch{position:absolute;top:14px;right:14px;display:flex;gap:4px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);padding:4px;border-radius:999px}
.phase-switch button{all:unset;cursor:pointer;font-size:11.5px;color:#fff;padding:5px 10px;border-radius:999px}
.phase-switch button.on{background:rgba(255,255,255,.35)}
.quote{background:var(--panel);border-radius:var(--r);padding:18px 22px;margin-bottom:20px;border-left:4px solid var(--accent);display:flex;gap:16px;align-items:flex-start}
.quote p{font-family:Fraunces,serif;font-size:19px;margin:0 0 6px;line-height:1.4}
.quote span{color:var(--muted);font-size:13px}
.quote button{margin-left:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--panel);border-radius:var(--r);padding:20px 22px;border:1px solid var(--line)}
.card.full{grid-column:1/-1}
.card h3{font-size:17px;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.5}
.tag{font-family:Inter;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:999px}
input[type=text],input[type=number],textarea,select,input[type=date],input[type=time]{width:100%;font:inherit;font-size:14.5px;border:1px solid var(--line);background:#fffdfb;border-radius:10px;padding:10px 12px;color:var(--ink);outline:none;transition:.15s}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.chk{appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;transition:.15s;background:#fff;margin:0}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.btn{all:unset;cursor:pointer;background:var(--accent);color:#fff;font-size:13.5px;font-weight:500;padding:9px 15px;border-radius:10px;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:12.5px}
.btn.rec{background:#c0392b;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(192,57,43,.18)}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;background:#fff;transition:.15s}
.pill.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.slip{background:#fbe3e0;border-color:#e2928a;color:#9b3a31}
.moods{display:flex;gap:8px}
.mood{all:unset;cursor:pointer;font-size:24px;padding:6px 9px;border-radius:12px;filter:grayscale(1);opacity:.55;transition:.15s}
.mood.on{filter:none;opacity:1;background:var(--accent-soft)}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 20px;gap:12px;flex-wrap:wrap}
.section-head h1{font-size:30px}
.section-head p{color:var(--muted);margin:4px 0 0;font-size:14px}
.meta{color:var(--muted);font-size:12.5px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
input[type=range]{width:100%;accent-color:var(--accent)}
.week{display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(7,1fr) 64px;gap:6px;align-items:center;font-size:13.5px}
.week .h{color:var(--muted);font-size:11.5px;text-align:center}
.week .cell{display:grid;place-items:center}
.week .rate{text-align:right;color:var(--muted);font-size:12.5px}
.week .rate.hit{color:var(--ok);font-weight:600}
.tri{all:unset;cursor:pointer;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;background:#fff}
.tri.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tri.no{background:#fbe3e0;border-color:#e2928a;color:#9b3a31}
.tri[disabled]{opacity:.3;pointer-events:none}
.x{all:unset;cursor:pointer;color:#c9bfb4;font-size:18px;padding:0 4px}
.x:hover{color:#c0392b}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:12px}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;font-size:13.5px;color:var(--muted)}
.tabs button.on{background:var(--accent);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-family:Fraunces,serif;font-size:26px;margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .col i{width:100%;max-width:38px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px;opacity:.9}
.chart .col span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.hrow{display:grid;grid-template-columns:160px 1fr 70px;gap:12px;align-items:center;margin-bottom:10px;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.value{display:flex;gap:14px;align-items:flex-start}
.value .dot{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700;font-size:18px;flex-shrink:0}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;font-size:13px;padding:9px 14px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;max-width:340px;z-index:30}
.toast.show{opacity:.94}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.l{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.proud{background:linear-gradient(135deg,var(--accent-soft),#fff 70%)}
.wins{display:flex;flex-wrap:wrap;gap:8px}
.win-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.warn{border-color:var(--accent);background:var(--accent-soft)}
.ok-msg,.slip-msg,.info-msg{margin:10px 0 0;padding:10px 13px;border-radius:10px;font-size:14px;line-height:1.5}
.ok-msg{background:#e3f2e8;color:#2f6b43}
.slip-msg{background:#fbe9e6;color:#8a3a30}
.info-msg{background:var(--accent-soft);color:var(--ink)}
.voice{background:linear-gradient(135deg,#2a2620,#4a3f35);color:#f4ede4;border:none}
.voice .hint{color:#cfc4b6}
.voice textarea{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff;min-height:84px}
.voice textarea::placeholder{color:#a99f93}
.voice .btn.ghost{color:#e8ddd0;border-color:rgba(255,255,255,.25)}
.avoid-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.avoid-stat{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.4}
.avoid-stat b{color:var(--ok)}
.task{display:grid;grid-template-columns:auto 1fr 170px;gap:10px;align-items:center;margin-bottom:10px}
.ai-out{font-size:14.5px;line-height:1.6}
.ai-out ul{padding-left:20px;margin:6px 0}
.ai-out h4{font-family:Fraunces,serif;font-size:15.5px;margin:12px 0 4px}
.ai-out p{margin:6px 0}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:#8f857a;display:inline-block}
.sync.on i{background:#6fcf8e}
/* Fokus-Karte */
.mission{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-bottom:20px;box-shadow:0 12px 30px -24px rgba(0,0,0,.4)}
.mission .goal-line{font-family:Fraunces,serif;font-size:22px;line-height:1.3;margin:2px 0 4px}
.mission .why{color:var(--muted);font-size:14px;margin-bottom:16px}
.countdown{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:12px;padding:11px 13px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.stat b{font-size:17px}
.verdict{font-size:15.5px;line-height:1.5;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.verdict.good{background:#e3f2e8;color:#2f6b43}
.verdict.alert{background:#fbe9e6;color:#8a3a30}
.now-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 12px;font-weight:600}
details.more{margin-top:22px}
details.more summary{cursor:pointer;list-style:none;color:var(--muted);font-size:14px;padding:12px 16px;border:1px dashed var(--line);border-radius:12px;text-align:center}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:20px}
/* Sprach-Button + Fenster */
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);z-index:20;display:grid;place-items:center}
.fab:hover{filter:brightness(1.08)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{width:100%;max-width:620px;margin-bottom:auto;margin-top:auto}
/* Layouts */
body.t-ruhig .hero{height:110px}
body.t-ruhig .hero svg.scene{opacity:.35}
body.t-ruhig .hero-txt{color:var(--ink);text-shadow:none}
body.t-ruhig .quote{border-left-color:var(--line)}
body.t-ruhig .proud{background:var(--panel)}
body.t-dunkel{--bg:#16181d!important;--panel:#1f2229!important;--ink:#ece8e1!important;--muted:#9a958c!important;--line:#2e323b!important;--side:#0f1115}
body.t-dunkel input,body.t-dunkel textarea,body.t-dunkel select{background:#262a32!important;color:#ece8e1}
body.t-dunkel .pill,body.t-dunkel .tri,body.t-dunkel .chk,body.t-dunkel .win-chip{background:#262a32}
body.t-dunkel .stat{background:#262a32}
body.t-dunkel .proud{background:var(--panel)}
.layout-opt{display:flex;gap:14px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;margin-bottom:10px}
.layout-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.layout-opt .sw{width:64px;height:42px;border-radius:9px;flex-shrink:0;overflow:hidden;position:relative}
@media (max-width:860px){
  .fab{bottom:calc(84px + env(safe-area-inset-bottom));right:16px}
  .status{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .stat{padding:9px 10px}
  .mission .goal-line{font-size:19px}
  .app{flex-direction:column}
  nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10;gap:0}
  .brand,.nav-label,.side-foot{display:none}
  .nav-btn{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 6px;flex:1;text-align:center;justify-content:center}
  main{padding:14px 14px 100px}
  .grid,.two{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .hero{height:160px}
  .hero-txt h1{font-size:25px}
  .week{grid-template-columns:minmax(90px,1.3fr) repeat(7,1fr) 44px;font-size:12.5px}
  .hrow{grid-template-columns:110px 1fr 56px}
  .task{grid-template-columns:auto 1fr}
  .task select{grid-column:2}
  .quote p{font-size:17px}
}

/* Hero mit Spruch */
.hero{height:230px}
.hero-txt{display:flex;gap:16px;align-items:flex-end}
.hero-ico{display:none}
.hq{font-family:Fraunces,serif;font-style:italic;font-size:16px;line-height:1.45;margin:8px 0 0;opacity:.95;max-width:640px}
.hq span{font-family:Inter;font-style:normal;font-size:12px;opacity:.8}
.commit{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.commit .signed{font-family:Fraunces,serif;font-style:italic;font-size:15px}
.commit .promise{font-size:13.5px;color:var(--muted);flex:1;min-width:200px;line-height:1.45}

/* ===== Design: Verbindlich ===== */
body.t-verbindlich[class]{--bg:#f3f0e8;--panel:#fffdf8;--ink:#1c2230;--muted:#6f6a60;--line:#dcd5c6;--accent:#b08d3c;--accent-soft:#f5ecd6;--ok:#2f6b4a;--slip:#9c8562;--side:#1c2230;--r:6px}
body.t-verbindlich .card,body.t-verbindlich .kpi{border-radius:6px;box-shadow:none}
body.t-verbindlich .btn{border-radius:4px;letter-spacing:.01em}
body.t-verbindlich .pill{border-radius:4px}
body.t-verbindlich .nav-btn{border-radius:4px}
body.t-verbindlich .proud{background:var(--panel)}
body.t-verbindlich .tag{border-radius:3px;background:transparent;border:1px solid var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
body.t-verbindlich .card h3{font-size:18px}
body.t-verbindlich .hero{height:auto;background:transparent;box-shadow:none;border-radius:0;overflow:visible;padding:4px 0 20px;border-bottom:1px solid var(--line)}
body.t-verbindlich .hero>svg.scene{display:none}
body.t-verbindlich .hero-txt{position:static;color:var(--ink);text-shadow:none;align-items:center}
body.t-verbindlich .hero-ico{display:block;width:54px;height:54px;border-radius:50%;overflow:hidden;position:relative;flex-shrink:0;border:2px solid var(--accent)}
body.t-verbindlich .hero-ico svg{position:absolute;inset:0;width:100%;height:100%}
body.t-verbindlich .hero-txt .date{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--muted)}
body.t-verbindlich .hq{color:var(--ink)}
body.t-verbindlich .hq span{color:var(--muted)}
body.t-verbindlich .mission{background:var(--ink);color:#f3f0e8;border:none;border-radius:6px;box-shadow:none;border-left:5px solid var(--accent)}
body.t-verbindlich .mission .why,body.t-verbindlich .mission .stat small,body.t-verbindlich .commit .promise{color:#b9b3a8}
body.t-verbindlich .mission .stat{background:rgba(255,255,255,.06);border-radius:4px}
body.t-verbindlich .mission .verdict{background:rgba(255,255,255,.08);color:#fff;border-radius:4px}
body.t-verbindlich .mission .verdict.good{background:rgba(47,107,74,.45)}
body.t-verbindlich .mission .verdict.alert{background:rgba(176,141,60,.28)}
body.t-verbindlich .pill.slip,body.t-verbindlich .tri.no{background:#ece6da;border-color:#b9a98d;color:#5f5038}
body.t-verbindlich .slip-msg{background:#efe9dc;color:#4f4433}
body.t-verbindlich .x:hover{color:var(--ink)}
body.t-verbindlich .countdown{border-radius:3px;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
body.t-verbindlich .mission .label{display:block}
.mission .label{display:none;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#b9b3a8;margin-bottom:8px}
body.t-verbindlich .now-label{color:var(--accent)}
/* Der rote Faden */
body.t-verbindlich .thread{grid-template-columns:1fr;position:relative;padding-left:32px}
body.t-verbindlich .thread::before{content:"";position:absolute;left:10px;top:28px;bottom:24px;width:2px;background:var(--accent)}
body.t-verbindlich .thread>.card{position:relative}
body.t-verbindlich .thread>.card::before{content:"";position:absolute;left:-29px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
body.t-verbindlich details.more summary{border-radius:4px}
@media (max-width:860px){.hero{height:210px}.hq{font-size:14px}body.t-verbindlich .hero{height:auto}body.t-verbindlich .thread{padding-left:24px}body.t-verbindlich .thread::before{left:6px}body.t-verbindlich .thread>.card::before{left:-23px}}

/* Tagesabschnitte */
.day-sec{margin-bottom:14px}
.sec-head{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.sec-head .t{font-family:Fraunces,serif;font-size:18px;font-weight:600}
.sec-head .sum{color:var(--muted);font-size:13px;flex:1;text-align:right}
.sec-head .chev{color:var(--muted);transition:.2s}
.day-sec.open .sec-head{border-color:transparent;background:transparent;padding-left:0}
.day-sec.open .chev{transform:rotate(180deg)}
.day-sec.done .sum{color:var(--ok);font-weight:600}
.sec-body{margin-top:6px}

<body>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Daten & Speicherung (Cloud über claude-db, Fallback lokal)
   ========================================================= */
const LKEY='erfolgsjournal_v1';
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>iso(new Date());
const addDays=(ds,n)=>{const d=new Date(ds+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const uid=()=>Math.random().toString(36).slice(2,9);
const DISTR_SEED=[['alk','🍺 Alkohol'],['shorts','📱 Shorts / Social Media'],['suess','🍫 Süßes / Snacks'],['spaet','🌙 Zu spät ins Bett'],['prok','⏳ Aufgeschoben'],['couch','🛋️ Keine Bewegung']];

function seedGoals(){return[
    {id:'g0',master:true,title:'Trading zu meiner Lebensgrundlage machen',why:'',deadline:'',progress:10},
    {id:'g3',title:'Gesunder Körper und Geist – gesund ernähren',why:'Energie und Klarheit für mein Masterziel',deadline:'',progress:20},
    {id:'g1',title:'Silvesterlauf entspannt finishen',why:'Gesund und fit ins neue Jahr',deadline:'2026-12-31',progress:40}
  ]}
function seedIdeal(){return[
    {id:'i1',time:'06:00',end:'',title:'Aufstehen'},
    {id:'i2',time:'06:15',end:'06:45',title:'Yoga'},
    {id:'i3',time:'09:00',end:'',title:'Trading Session'}
  ]}
function seed(){return{
  name:'David',
  goals:seedGoals(),
  idealDay:seedIdeal(),idealWhy:'',
  habits:[
    {id:'h1',name:'Raus an die frische Luft',icon:'🌳',type:'do',target:7},
    {id:'h2',name:'Laufen',icon:'🏃',type:'do',target:3},
    {id:'h4',name:'2 Liter Wasser',icon:'💧',type:'do',target:7},
    {id:'h5',name:'10 Min. lesen',icon:'📖',type:'do',target:5},
    {id:'h6',name:'Kein Alkohol',icon:'🍺',type:'avoid',cost:3,unit:'€'},
    {id:'h7',name:'Kein Handy ab 22 Uhr',icon:'📵',type:'avoid',cost:60,unit:'Min.'},
    {id:'h3',name:'Keine Süßigkeiten',icon:'🍬',type:'avoid',cost:2,unit:'€'}
  ],
  values:[
    {id:'v1',name:'Gesundheit',desc:'Mein Körper trägt mich durchs Leben – ich behandle ihn entsprechend.'},
    {id:'v2',name:'Familie',desc:'Zeit mit den Menschen, die mir am wichtigsten sind, hat Vorrang.'},
    {id:'v3',name:'Disziplin',desc:'Ich tue, was ich mir vornehme – auch wenn keiner zuschaut.'}
  ],
  days:{}
}}
const dl=()=>S.distractions;
const DAY_DEFAULT=()=>({committed:'',goal:'',grat:['','',''],tasks:[{t:'',done:false,goal:''},{t:'',done:false,goal:''}],habits:{},good:'',learn:'',mood:0,win:'',bed:'',phoneOff:'',distr:[],distrNote:''});
function normalize(s){
  s.goals=s.goals||[];s.values=s.values||[];s.habits=s.habits||[];s.days=s.days||{};
  s.distractions=s.distractions||DISTR_SEED.map(x=>[...x]);
  s.settings=Object.assign({layout:'verbindlich',evening:17},s.settings||{});
  if((s.settings.v||0)<2){s.settings.layout='verbindlich'}
  if((s.settings.v||0)<3){
    // Beispielziele (unverändert) auf Masterziel-Struktur umstellen
    if(s.goals.length===2&&s.goals[0].id==='g1'&&s.goals[1].id==='g2'&&s.goals[1].title==='5 kg abnehmen')s.goals=seedGoals();
    if(s.settings.main&&s.goals.find(g=>g.id===s.settings.main))s.goals.forEach(g=>g.master=g.id===s.settings.main);
    if(!s.idealDay)s.idealDay=seedIdeal();
  }
  if((s.settings.v||0)<4){
    const g0=s.goals.find(g=>g.id==='g0'&&g.title==='Trading zu meiner Lebensgrundlage machen');
    if(g0)Object.assign(g0,{title:'Trading: konstant monatlich auszahlen',metric:'Auszahlung (17 Konten)',target:2000,unit:'$',rhythm:'monat',start:'2026-12-01',deadline:'2027-05-31',months:{},
      vision:'Ich bestimme selbst über meine Zeit und meinen Tag\nMein Einkommen hängt von meiner Kompetenz ab – nicht von einzelnen Abschlüssen\nIch lebe meinen idealen Tag, nicht nur am Wochenende',
      obstacle:'Abends Bier und Shorts – am nächsten Morgen unkonzentriert in der Session',plan:'Wenn ich abends Lust auf Bier habe, trinke ich Alkoholfreies und lege das Handy um 22 Uhr in die Küche.'});
    s.goals.forEach(g=>{if(g.id==='g1'&&!g.start)g.start='2026-11-01';if(g.id==='g3'&&!g.start){g.start='2026-12-01';g.deadline=g.deadline||'2027-05-31'}});
  }
  s.settings.v=4;
  if(s.goals.length&&!s.goals.some(g=>g.master))s.goals[0].master=true;
  s.idealDay=s.idealDay||seedIdeal();s.idealWhy=s.idealWhy||'';
  s.habits.forEach(h=>{h.type=h.type||'do';if(h.type==='do'&&!h.target)h.target=7;if(h.type==='avoid'){if(h.cost==null)h.cost=0;h.unit=h.unit||'€'}});
  Object.keys(s.days).forEach(k=>{s.days[k]=Object.assign(DAY_DEFAULT(),s.days[k]);s.days[k].tasks.forEach(t=>{if(t.goal==null)t.goal=''})});
  return s;
}
let S;
try{S=JSON.parse(localStorage.getItem(LKEY))}catch(e){}
S=normalize(S||seed());
function day(d=today()){if(!S.days[d])S.days[d]=DAY_DEFAULT();return S.days[d]}
const metaObj=()=>({distractions:S.distractions,idealDay:S.idealDay,idealWhy:S.idealWhy,name:S.name,goals:S.goals,habits:S.habits,values:S.values,settings:S.settings});

/* --- Cloud (Supabase) --- */
const CFG=window.EJ_CONFIG||{};
const CONFIGURED=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&!/DEIN|XXX/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY));
const SB=CONFIGURED&&window.supabase?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
let UID=null, cloud=false, dictation=null;
const dirty=new Set(), pend={}, inflight={};
let saveT,saveSt={st:'ok',t:''};
function setSave(st){if(st==='ok'){const n=new Date();saveSt={st,t:String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}}else saveSt={st,t:saveSt.t};renderSave()}
function renderSave(){let el=document.getElementById('savepill');if(!el){el=document.createElement('div');el.id='savepill';document.body.appendChild(el)}
  const st=!cloud?'local':saveSt.st;el.className='savepill '+st;
  el.innerHTML='<i></i>'+(st==='local'?(CONFIGURED?'Nicht verbunden – nur auf diesem Gerät':'Testmodus – nur auf diesem Gerät'):st==='saving'?'Speichert …':st==='error'?'⚠ Nicht gespeichert – wird erneut versucht':'✓ Gespeichert'+(saveSt.t?' · '+saveSt.t:''))}
function markDay(d=today()){dirty.add('d-'+d);schedule()}
function markMeta(){dirty.add('meta');schedule()}
function schedule(){
  try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}
  if(cloud)setSave('saving');
  clearTimeout(saveT);saveT=setTimeout(()=>{dirty.forEach(k=>queue(k));dirty.clear();if(!cloud)renderSave()},600);
}
function queue(k){if(!cloud)return;pend[k]=JSON.parse(JSON.stringify(k==='meta'?metaObj():S.days[k.slice(2)]||{}));flush(k)}
async function flush(k){
  if(inflight[k]||!(k in pend))return;
  const data=pend[k];delete pend[k];inflight[k]=true;
  const {error}=await SB.from('journal').upsert({user_id:UID,key:k,data,updated_at:new Date().toISOString()});
  if(error){console.warn('db',error);if(!(k in pend))pend[k]=data;setSave('error');setTimeout(()=>flush(k),5000+Math.random()*3000)}
  inflight[k]=false;if(k in pend&&!error)flush(k);
  if(!error&&!Object.keys(pend).length&&!Object.values(inflight).some(Boolean)&&!dirty.size)setSave('ok');
}
async function loadAll(){
  let rows=[],from=0;
  while(true){const {data,error}=await SB.from('journal').select('key,data').range(from,from+999);if(error)throw error;rows=rows.concat(data);if(data.length<1000)break;from+=1000}
  return rows;
}
async function initCloud(){
  dictation=makeDictation();
  if(!SB)return;
  try{
    const {data:{session}}=await SB.auth.getSession();
    if(!session){showLogin();return}
    UID=session.user.id;
    const rows=await loadAll();
    if(!rows.length){
      cloud=true;queue('meta');Object.keys(S.days).forEach(d=>queue('d-'+d));
    }else{
      const n={name:S.name,goals:[],habits:[],values:[],days:{}};
      rows.forEach(r=>{if(r.key==='meta')Object.assign(n,r.data);else if(r.key.startsWith('d-'))n.days[r.key.slice(2)]=r.data});
      S=normalize(n);cloud=true;
      try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}
    }
    setSync();render();setSave('ok');
  }catch(e){console.warn('cloud init',e);renderSave();toast('Keine Verbindung – du arbeitest mit dem letzten Stand auf diesem Gerät.',4000);setSync()}
}
function showLogin(){
  document.querySelector('.app').style.display='none';
  let el=document.getElementById('auth');if(!el){el=document.createElement('div');el.id='auth';el.className='auth';document.body.appendChild(el)}
  el.innerHTML=`<div class="card"><h1>Erfolgsjournal</h1><div class="meta">Log dich in deinen Tag ein.</div><div class="gold"></div>
    <input type="email" id="aE" placeholder="E-Mail" autocomplete="email">
    <input type="password" id="aP" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="current-password">
    <div class="err" id="aErr"></div>
    <div class="row"><button class="btn" id="aIn">Anmelden</button><button class="btn ghost" id="aUp">Konto erstellen</button></div></div>`;
  const go=async up=>{const email=el.querySelector('#aE').value.trim(),password=el.querySelector('#aP').value,err=el.querySelector('#aErr');err.textContent='';
    if(!email||password.length<6){err.textContent='Bitte E-Mail und ein Passwort mit mind. 6 Zeichen eingeben.';return}
    const r=up?await SB.auth.signUp({email,password}):await SB.auth.signInWithPassword({email,password});
    if(r.error){err.textContent=r.error.message==='Invalid login credentials'?'E-Mail oder Passwort falsch.':r.error.message;return}
    if(up&&!r.data.session){err.style.color='inherit';err.textContent='Fast geschafft: Bestätige den Link in deiner E-Mail und melde dich dann an.';return}
    el.remove();document.querySelector('.app').style.display='';initCloud()};
  el.querySelector('#aIn').onclick=()=>go(false);el.querySelector('#aUp').onclick=()=>go(true);
  el.querySelector('#aP').onkeydown=e=>{if(e.key==='Enter')go(false)};
}
/* Spracheingabe über den Browser (Chrome/Android) */
function makeDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,cb={p:()=>{},f:()=>{},s:()=>{}};
  return{
    onPartial:f=>cb.p=f,onFinal:f=>cb.f=f,onState:f=>cb.s=f,
    start(){return new Promise((res,rej)=>{rec=new SR();rec.lang='de-DE';rec.interimResults=true;rec.continuous=true;
      rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)cb.f({text:r[0].transcript.trim()});else interim+=r[0].transcript}cb.p({text:interim})};
      rec.onerror=e=>{cb.s({state:'idle',reason:e.error});if(e.error==='not-allowed')rej({code:'not_granted'})};
      rec.onend=()=>cb.s({state:'idle',reason:'stopped'});
      rec.onstart=()=>{cb.s({state:'listening'});res()};
      try{rec.start()}catch(e){rej(e)}})},
    stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()}
  };
}
/* KI über die Supabase-Funktion „ai“ (der API-Schlüssel liegt sicher auf dem Server) */
async function callAI(prompt,opts={}){
  if(!SB||!cloud)throw{code:'no_ai'};
  const {data,error}=await SB.functions.invoke('ai',{body:{prompt,max_tokens:opts.max_tokens||1500}});
  if(error||!data||data.error)throw{code:'ai_error',message:(data&&data.error)||(error&&error.message)};
  return data.text||'';
}
const aiSample={json:async(p,o)=>{const t=await callAI(p,o);const m=t.match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:t)}};
async function aiText(p,onText){const t=await callAI(p,{max_tokens:1200});onText&&onText({text:t});return{text:t}}
const aiMsg=e=>e&&e.code==='no_ai'?'KI braucht Login und die eingerichtete KI-Funktion (siehe Anleitung).':'KI gerade nicht erreichbar – ist die Funktion „ai“ eingerichtet?';
function setSync(){const el=document.getElementById('sync');if(el){el.className='sync'+(cloud?' on':'');el.innerHTML='<i></i>'+(cloud?'Synchronisiert':CONFIGURED?'Nicht verbunden':'Testmodus – nur auf diesem Gerät')}}

/* =========================================================
   Helpers
   ========================================================= */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(t,ms=1800){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),ms)}
const M=document.getElementById('main');
function bind(sel,fn,ev='input'){M.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,e=>fn(el,e)))}
const fmtDate=d=>new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const short=d=>d.slice(8)+'.'+d.slice(5,7)+'.';
function weekDays(ref=today()){const d=new Date(ref+'T12:00');const wd=(d.getDay()+6)%7;return [...Array(7)].map((_,i)=>addDays(ref,i-wd))}
function minsBetween(a,b){if(!a||!b)return null;const [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);let m=(bh*60+bm)-(ah*60+am);if(m<0)m+=1440;return m}
const goalById=id=>S.goals.find(g=>g.id===id);
const masterGoal=()=>S.goals.find(g=>g.master)||S.goals[0];
const lastN=n=>[...Array(n)].map((_,i)=>addDays(today(),-i)).reverse();

/* Verzicht: verzeihende Statistik statt harter Serie */
function avoidStats(h,n=30){
  const ds=lastN(n);let ok=0,slip=0;
  ds.forEach(d=>{const v=S.days[d]?.habits?.[h.id];if(v===true)ok++;else if(v===false)slip++});
  // Tage seit letztem Ausrutscher (nicht eingetragene Tage brechen nichts)
  let since=0,d=today(),guard=0;const first=Object.keys(S.days).filter(k=>S.days[k].habits?.[h.id]!==undefined).sort()[0];
  if(first){while(guard++<3650){const v=S.days[d]?.habits?.[h.id];if(v===false)break;if(d<first)break;if(v===true)since++;d=addDays(d,-1)}}
  return{ok,slip,n,since,saved:ok*(h.cost||0)};
}
function kept(ds){const x=S.days[ds];if(!x||!x.committed)return false;const t=x.tasks.filter(t=>t.t.trim());return t.length>0&&t.every(t=>t.done)&&!S.habits.some(h=>h.type==='avoid'&&x.habits?.[h.id]===false)}
function weekCount(h,ref=today()){return weekDays(ref).filter(d=>S.days[d]?.habits?.[h.id]===true).length}
function fmtSaved(v,unit){if(unit==='Min.'){return v>=60?(Math.round(v/6)/10)+' Std.':v+' Min.'}return v+' '+unit}

let voiceText='',recording=false,aiBusy=false,lastApplied='',dictAcc='',dictWired=false;
async function aiFill(){
  const txt=voiceText.trim();if(!txt||aiBusy)return;
  if(!SB||!cloud){toast(aiMsg({code:'no_ai'}),4000);return}
  aiBusy=true;render();
  const d=day();
  const prompt=`Du bist der Eingabe-Assistent eines deutschen Erfolgsjournals. Der Nutzer hat frei eingesprochen, was in sein heutiges Journal soll. Ordne den Text den Feldern zu. Erfinde nichts, lass Felder weg, die nicht vorkommen. Formuliere kurz und in der Ich-Form, korrigiere Diktierfehler.

Verfügbare Ziele (id: Titel):
${S.goals.map(g=>g.id+': '+g.title+(g.master?' (MASTERZIEL)':'')).join('\n')||'(keine)'}

Gewohnheiten zum TUN (id: Name):
${S.habits.filter(h=>h.type==='do').map(h=>h.id+': '+h.name).join('\n')||'(keine)'}

Dinge, auf die der Nutzer bewusst VERZICHTET (id: Name):
${S.habits.filter(h=>h.type==='avoid').map(h=>h.id+': '+h.name).join('\n')||'(keine)'}

Ablenkungs-Kategorien (key: Name): ${dl().map(x=>x[0]+': '+x[1].replace(/^\S+\s/,'')).join(', ')}

Antworte NUR mit JSON in genau dieser Form (alle Felder optional):
{"focus":"Tagesfokus in einem Satz","gratitude":["…"],"tasks":[{"text":"…","goal":"Ziel-id oder leer"}],"done":["id von erledigten TUN-Gewohnheiten"],"avoided":["id von Verzicht-Gewohnheiten, bei denen er standhaft blieb"],"slipped":["id von Verzicht-Gewohnheiten, bei denen er schwach wurde"],"distractions":["key"],"distractionNote":"Auswirkung/Auslöser","win":"heutiger Erfolg","good":"was war gut","learn":"was morgen besser","mood":1-5,"bed":"HH:MM","phoneOff":"HH:MM"}

Regeln: höchstens 3 Dankbarkeiten, höchstens 2 Aufgaben (die wichtigsten, die auf ein Ziel einzahlen). Wenn er z. B. sagt, er habe Bier getrunken, dann slipped = Alkohol-id UND distractions enthält "alk". Shorts/YouTube/Instagram im Bett = "shorts".

Text des Nutzers:
"""${txt}"""`;
  try{
    const r=await aiSample.json(prompt,{max_tokens:1200});
    const applied=[];
    if(r.focus){d.goal=r.focus;applied.push('Fokus')}
    if(Array.isArray(r.gratitude)&&r.gratitude.length){
      r.gratitude.slice(0,3).forEach(g=>{let i=d.grat.findIndex(x=>!x.trim());if(i<0)i=d.grat.length-1;d.grat[i]=g});applied.push('Dankbarkeit')}
    if(Array.isArray(r.tasks)&&r.tasks.length){
      r.tasks.slice(0,2).forEach(t=>{let i=d.tasks.findIndex(x=>!x.t.trim());if(i<0)i=d.tasks.length-1;d.tasks[i]={t:t.text||'',done:false,goal:goalById(t.goal)?t.goal:''}});applied.push('Schritte')}
    (r.done||[]).forEach(id=>{if(S.habits.find(h=>h.id===id))d.habits[id]=true});
    (r.avoided||[]).forEach(id=>{if(S.habits.find(h=>h.id===id))d.habits[id]=true});
    (r.slipped||[]).forEach(id=>{if(S.habits.find(h=>h.id===id))d.habits[id]=false});
    if((r.done||[]).length||(r.avoided||[]).length||(r.slipped||[]).length)applied.push('Gewohnheiten');
    (r.distractions||[]).forEach(k=>{if(dl().find(x=>x[0]===k)&&!d.distr.includes(k))d.distr.push(k)});
    if((r.distractions||[]).length)applied.push('Ablenkungen');
    if(r.distractionNote){d.distrNote=d.distrNote?d.distrNote+' '+r.distractionNote:r.distractionNote}
    if(r.win){d.win=r.win;applied.push('Erfolg')}
    if(r.good){d.good=d.good?d.good+'\n'+r.good:r.good;applied.push('Reflexion')}
    if(r.learn){d.learn=d.learn?d.learn+'\n'+r.learn:r.learn}
    if(r.mood>=1&&r.mood<=5)d.mood=Math.round(r.mood);
    if(/^\d{1,2}:\d{2}$/.test(r.bed||''))d.bed=r.bed.padStart(5,'0');
    if(/^\d{1,2}:\d{2}$/.test(r.phoneOff||''))d.phoneOff=r.phoneOff.padStart(5,'0');
    voiceText='';lastApplied=applied.length?'Eingetragen: '+applied.join(', ')+'. Schau kurz drüber – du kannst alles ändern.':'Ich konnte nichts Passendes finden. Sag z. B. „Mein Fokus heute …“';
    markDay();
    if(applied.length){sheetOpen=false;toast(lastApplied,4500);lastApplied=''}
  }catch(e){
    lastApplied='';
    toast(aiMsg(e),4000);
  }
  aiBusy=false;render();
}
function toggleDictation(){
  if(!dictation)return;
  if(recording){dictation.stop().catch(()=>{});return}
  dictAcc=voiceText?voiceText.trim()+' ':'';
  if(!dictWired){dictWired=true;
    dictation.onPartial(({text})=>{const ta=document.querySelector('#voice');if(ta)ta.value=dictAcc+text});
    dictation.onFinal(({text})=>{dictAcc+=text+' ';voiceText=dictAcc;const ta=document.querySelector('#voice');if(ta)ta.value=dictAcc});
    dictation.onState(({state})=>{recording=state==='listening';const b=document.querySelector('#mic');if(b){b.classList.toggle('rec',recording);b.innerHTML=recording?'⏹ Stopp':'🎙️ Einsprechen'}});
  }
  dictation.start().catch(e=>{recording=false;toast(e&&e.code==='not_granted'?'Mikrofon nicht erlaubt – du kannst auch tippen oder die Diktierfunktion deiner Tastatur nutzen.':'Mikrofon gerade nicht verfügbar.',4000)});
}

        <div><label class="l">Im Bett um</label><input type="time" id="bed" value="${esc(d.bed)}"></div>
        <div><label class="l">Handy weggelegt um</label><input type="time" id="phoneOff" value="${esc(d.phoneOff)}"></div>
      </div>
      <div id="screenMsg"></div>
      <div class="two" style="margin-top:14px">
        <div><label class="l">Was war heute gut?</label><textarea id="good" placeholder="Drei schöne Momente …">${esc(d.good)}</textarea></div>
        <div><label class="l">Was mache ich morgen besser?</label><textarea id="learn" placeholder="Eine Sache …">${esc(d.learn)}</textarea></div>
      </div>
      <label class="l" style="margin-top:14px">Wie war mein Tag?</label>
      <div class="moods">${['😞','😕','😐','🙂','😄'].map((m,i)=>`<button class="mood ${d.mood===i+1?'on':''}" data-m="${i+1}">${m}</button>`).join('')}</div>
    </div>`;

  // Fokus-Karte: Hauptziel, Countdown, Tagesstatus und eine ehrliche Ansage
  const main=masterGoal();
  const daysLeft=main&&main.deadline?Math.ceil((new Date(main.deadline+'T12:00')-new Date(today()+'T12:00'))/864e5):null;
  const tasksSet=d.tasks.filter(t=>t.t.trim()),tasksDone=tasksSet.filter(t=>t.done).length;
  const avToday=avH.map(h=>d.habits[h.id]),avOk=avToday.filter(v=>v===true).length,avSlip=avToday.filter(v=>v===false).length;
  const doneDo=doH.filter(h=>d.habits[h.id]===true).length;
  let verdict,vcls='';
  if(tasksSet.length&&tasksDone===tasksSet.length){verdict='Heute hast du geliefert. Beide Aufgaben erledigt – genau so entstehen Ergebnisse. 💪';vcls='good'}
  else if(!tasksSet.length&&(phase==='morgen'||phase==='tag')){verdict='Was bringt dich heute deinem Ziel näher? Leg deine 2 Aufgaben fest – bevor der Tag dich festlegt. Alles andere steht in TickTick.'}
  else if(!tasksSet.length){verdict='Heute ist noch nichts für dein Ziel festgelegt. Ein kleiner Schritt reicht – jetzt, nicht morgen.';vcls='alert'}
  else if(tasksDone===0&&(phase==='abend'||phase==='nacht')){verdict='Heute ist noch nichts für dein Ziel passiert. Eine Aufgabe, 20 Minuten – das reicht, damit der Tag zählt.';vcls='alert'}
  else verdict=`Noch ${tasksSet.length-tasksDone} Aufgabe${tasksSet.length-tasksDone>1?'n':''} offen. Erst das Ziel – dann Handy, Couch & Co.`;
  if(avSlip&&vcls!=='alert')verdict+=' Ein Ausrutscher heute ist kein Drama – morgen zählt wieder.';
  const missionCard=main?`
    <div class="mission">
      <span class="label">Mein Masterziel</span>
      <div class="goal-line">${esc(main.title)}</div>
      ${main.start&&main.deadline?`<div class="tbar"><i style="width:${timePct(main)}%"></i></div><div class="tstat">${timeStatus(main)}</div>`:''}
      ${main.why?`<div class="why" style="margin:10px 0 0">Warum: ${esc(main.why)}</div>`:''}
      ${visionLines(main).length?`<div class="vision" style="margin-top:12px"><span>Dadurch ändert sich mein Leben wie folgt:</span><ul>${visionLines(main).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>`:''}
    </div>`:'';
  const taskCardV=taskCard.replace('%%VERDICT%%',`<p class="verdict ${vcls}" style="margin:6px 0 14px;font-size:14px">${verdict}</p>`);

  // Drei Abschnitte: Morgen, Tagsüber, Abend – öffnen/schließen sich nach Uhrzeit und Erledigung
  const hr=new Date().getHours(),eve=S.settings.evening||17,isEve=hr>=eve||hr<5;
  const mDone=[!!d.goal.trim(),d.tasks.some(t=>t.t.trim()),d.grat.some(g=>g.trim())];
  const morningDone=mDone.every(Boolean);
  const avLogged=avH.filter(h=>d.habits[h.id]!==undefined).length;
  const eDone=[!!d.win.trim(),!!(d.good.trim()||d.learn.trim()),!!d.mood];
  const eveningDone=eDone.every(Boolean);
  const secs=[
    {k:'morgen',t:'Morgen',cards:[focusCard,taskCardV,gratCard],done:morningDone,
     sum:morningDone?'✓ Erledigt – Fokus, Aufgaben, Dankbarkeit':`${mDone.filter(Boolean).length}/3 ausgefüllt`,
     open:!morningDone&&!isEve},
    {k:'tag',t:'Tagsüber',cards:[doCard,avoidCard,proudCard],done:false,
     sum:`Gewohnheiten ${doneDo}/${doH.length} · Verzicht ${avOk}/${avH.length}`,
     open:morningDone&&!isEve},
    {k:'abend',t:'Abend',cards:[checkCard,avoidCard,winCard,reflectCard],done:eveningDone,
     sum:eveningDone?'✓ Tag abgeschlossen':isEve?'Jetzt dran':`öffnet ab ${eve}:00 Uhr`,
     open:isEve&&!eveningDone}
  ];
  // manuelles Auf-/Zuklappen für heute merken
  secs.forEach(x=>{const key=today()+x.k;if(secManual[key]!==undefined)x.open=secManual[key]});
  if(!secs.some(x=>x.open)&&!eveningDone)secs[isEve?2:1].open=true;

  M.innerHTML=`
  <section class="hero">${scene(phase)}
    <div class="hero-txt"><div class="hero-ico">${scene(phase,true)}</div><div><div class="date">${fmtDate(today())}</div><h1>${greet[phase]}, ${esc(S.name)}.</h1><p class="hq">„${esc(q[0])}“ <span>— ${esc(q[1])}</span></p></div></div>
  </section>
  ${!CONFIGURED?'<div class="banner">Testmodus: Deine Einträge liegen nur auf diesem Gerät. Für Login und Sync die Datei config.js ausfüllen (siehe Anleitung).</div>':''}
  ${missionCard}
  ${secs.map(x=>`<section class="day-sec ${x.open?'open':''} ${x.done?'done':''}">
    <button class="sec-head" data-sec="${x.k}"><span class="t">${x.t}</span><span class="sum">${x.sum}</span><span class="chev">▾</span></button>
    ${x.open?`<div class="grid thread sec-body">${x.cards.filter(Boolean).join('')}</div>`:''}
  </section>`).join('')}
`;
  bind('[data-sec]',el=>{const k=el.dataset.sec,open=el.parentElement.classList.contains('open');secManual[today()+k]=!open;viewTag()},'click');

  const cb=M.querySelector('#commit');if(cb)cb.onclick=()=>{
    if(!d.tasks.some(t=>t.t.trim())){toast('Leg zuerst deine 2 Aufgaben fest – dann sagst du zu.',3000);const f=M.querySelector('.task-t');if(f){const det=f.closest('details');if(det)det.open=true;f.focus()}return}
    const n=new Date();d.committed=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');markDay();toast('Zugesagt. Dein Wort gilt.',2500);viewTag()};
  bind('#goal',el=>{d.goal=el.value;markDay()});
  bind('.grat',el=>{d.grat[+el.dataset.i]=el.value;markDay()});
  bind('#gratMore',()=>{gratMore=true;viewTag()},'click');
  bind('.task-t',el=>{d.tasks[+el.dataset.i].t=el.value;markDay()});
  bind('.task-g',el=>{d.tasks[+el.dataset.i].goal=el.value;markDay()},'change');
  bind('.task-c',el=>{d.tasks[+el.dataset.i].done=el.checked;markDay();if(el.checked)toast('Stark – deinem Ziel ein Stück näher 💪')},'change');
  M.querySelector('#toTT').onclick=async()=>{
    const lines=d.tasks.filter(t=>t.t.trim()).map(t=>`${t.t.trim()} heute #Erfolgsjournal${t.goal&&goalById(t.goal)?' #'+goalById(t.goal).title.replace(/\s+/g,'-'):''}`);
    if(!lines.length){toast('Erst die 2 Aufgaben eintragen.');return}
    try{await navigator.clipboard.writeText(lines.join('\n'));toast('Kopiert – in TickTick einfügen.',2500)}catch(e){toast('Kopieren nicht möglich in dieser Ansicht.',2500)}
  };
  bind('[data-h]',el=>{const id=el.dataset.h;d.habits[id]=d.habits[id]===true?undefined:true;if(d.habits[id]===undefined)delete d.habits[id];markDay();viewTag()},'click');
  bind('[data-a]',el=>{const id=el.dataset.a,v=d.habits[id];
    if(v===undefined){d.habits[id]=true;toast('Stark geblieben 🛡️')}else if(v===true){d.habits[id]=false;toast('Passiert. Morgen ist ein neuer Tag.',2200)}else delete d.habits[id];
    markDay();viewTag()},'click');
  bind('#win',el=>{d.win=el.value;markDay()});
  bind('.dpill',el=>{const k=el.dataset.d;d.distr=d.distr.includes(k)?d.distr.filter(x=>x!==k):[...d.distr,k];el.classList.toggle('slip');markDay()},'click');
  bind('#distrNote',el=>{d.distrNote=el.value;markDay()});
  bind('#addDistr',el=>{const f=M.querySelector('#distrForm');f.style.display=f.style.display==='none'?'flex':'none';if(f.style.display==='flex')M.querySelector('#dN').focus()},'click');
  bind('#dAdd',()=>{const n=M.querySelector('#dN').value.trim();if(!n)return;const k='c'+uid();S.distractions.push([k,M.querySelector('#dI').value+' '+n]);d.distr.push(k);markMeta();markDay();toast('Neue Ablenkung angelegt und für heute markiert.');viewTag()},'click');
  const screen=()=>{const m=minsBetween(d.bed,d.phoneOff),box=M.querySelector('#screenMsg');if(!box)return;
    if(m===null){box.innerHTML='';return}
    box.innerHTML=m<=10?`<p class="ok-msg">💪 ${m?`Nur ${m} Min.`:'Kein'} Handy im Bett – stark.</p>`:
      `<p class="slip-msg">📱 <b>${m} Minuten</b> Handy im Bett. Aufs Jahr gerechnet wären das <b>${Math.round(m*365/60)} Stunden</b> – Zeit, die deinem Schlaf und deinen Zielen fehlt.</p>`};
  screen();
  bind('#bed',el=>{d.bed=el.value;markDay();screen()});
  bind('#phoneOff',el=>{d.phoneOff=el.value;markDay();screen()});
  bind('#good',el=>{d.good=el.value;markDay()});
  bind('#learn',el=>{d.learn=el.value;markDay()});
  bind('.mood',el=>{d.mood=+el.dataset.m;markDay();M.querySelectorAll('.mood').forEach(x=>x.classList.toggle('on',x===el))},'click');
}

/* =========================================================
   Ziele
   ========================================================= */
function goalSteps(gid,n=30){return lastN(n).flatMap(d=>(S.days[d]?.tasks||[]).filter(t=>t.goal===gid&&t.t).map(t=>({d,...t})))}
/* ---------- Ziele: SMART + WOOP, Fortschritt, Zeitstrahl ---------- */
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const fmtNum=n=>Number(n||0).toLocaleString('de-DE');
function goalMonths(g){if(!g.start||!g.deadline)return[];const out=[];let d=new Date(g.start.slice(0,7)+'-01T12:00');const end=new Date(g.deadline.slice(0,7)+'-01T12:00');let guard=0;
  while(d<=end&&guard++<60){out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));d.setMonth(d.getMonth()+1)}return out}
const monLabel=k=>MON[+k.slice(5)-1]+' '+k.slice(2,4);
const curMonth=()=>today().slice(0,7);
function measurable(g){return !!(g.metric&&+g.target)}
function goalProgress(g){
  if(measurable(g)&&g.rhythm==='monat'){const ms=goalMonths(g);if(!ms.length)return 0;return Math.round(ms.filter(m=>+(g.months||{})[m]>=+g.target).length/ms.length*100)}
  if(measurable(g))return Math.min(100,Math.round((+g.current||0)/(+g.target)*100));
  return g.progress||0;
}
function timeStatus(g){
  if(!g.start||!g.deadline)return '';
  const t=today();
  if(t<g.start){const n=Math.ceil((new Date(g.start+'T12:00')-new Date(t+'T12:00'))/864e5);return `Startet in ${n} ${n===1?'Tag':'Tagen'} (${new Date(g.start+'T12:00').toLocaleDateString('de-DE')})`}
  if(t>g.deadline)return 'Zeitraum abgeschlossen';
  const ms=goalMonths(g);const i=ms.indexOf(curMonth());
  let s=ms.length>1&&i>=0?`Monat ${i+1} von ${ms.length}`:'';
  const left=Math.ceil((new Date(g.deadline+'T12:00')-new Date(t+'T12:00'))/864e5);s+=(s?' · ':'')+`noch ${left} Tage`;
  if(measurable(g)&&g.rhythm==='monat'){const v=(g.months||{})[curMonth()];s+=` · ${MON[+curMonth().slice(5)-1]}: ${fmtNum(v||0)} / ${fmtNum(g.target)} ${esc(g.unit||'')}`}
  return s;
}
function timePct(g){if(!g.start||!g.deadline)return 0;const a=new Date(g.start+'T12:00'),b=new Date(g.deadline+'T12:00'),n=new Date(today()+'T12:00');return Math.max(0,Math.min(100,(n-a)/(b-a)*100))}
const visionLines=g=>(g.vision||'').split('\n').map(x=>x.trim()).filter(Boolean);

function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function goalTimeline(){
  const G=S.goals.filter(g=>g.start&&g.deadline);
  if(!G.length)return `<div class="card"><p class="empty">Gib deinen Zielen über „Bearbeiten“ einen Start und ein Ende – dann erscheinen sie hier.</p></div>`;
  const scale='monat';
  let a=G.map(g=>g.start).concat(today()).sort()[0],b=G.map(g=>g.deadline).sort().slice(-1)[0];
  // Spalten bauen
  let cols=[],A,B;
  if(scale==='kw'){
    const s0=new Date(a+'T12:00');s0.setDate(s0.getDate()-((s0.getDay()+6)%7));A=new Date(iso(s0)+'T00:00');
    const e0=new Date(b+'T12:00');let d=new Date(A);while(d<=e0||cols.length<12){cols.push({k:iso(d),l:'KW '+isoWeek(d)});d.setDate(d.getDate()+7)}
    B=new Date(d);
  }else{
    const ms=goalMonths({start:a.slice(0,7)+'-01',deadline:b});while(ms.length<6){const d=new Date(ms[ms.length-1]+'-01T12:00');d.setMonth(d.getMonth()+1);ms.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
    cols=ms.map(m=>({k:m,l:monLabel(m)}));A=new Date(ms[0]+'-01T00:00');B=new Date(ms[ms.length-1]+'-01T00:00');B.setMonth(B.getMonth()+1);
  }
  const span=B-A,pos=ds=>Math.max(0,Math.min(100,(new Date(ds+'T12:00')-A)/span*100));
  const every=scale==='kw'?(cols.length>30?4:cols.length>16?2:1):1;
  const sorted=[...G].sort((x,y)=>(y.master?1:0)-(x.master?1:0));
  const grid=`background-size:${100/cols.length}% 100%`;
  return `<div class="card gt">
    <div class="gt-inner">
    <div class="gt-head"><div></div><div class="gt-months">${cols.map((c,i)=>`<span>${i%every===0?c.l:''}</span>`).join('')}</div></div>
    ${sorted.map(g=>{const l=pos(g.start),r=pos(g.deadline);const segs=measurable(g)&&g.rhythm==='monat'?goalMonths(g):[];
      return `<div class="gt-row ${g.master?'master':''}"><div class="gt-label" title="${esc(g.title)}">${esc(g.title)}</div>
      <div class="gt-track" style="${grid}"><div class="gt-bar" style="left:${l}%;width:${Math.max(1.5,r-l)}%">${segs.length?segs.map(m=>{const v=(g.months||{})[m];const st=v==null||v===''?(m<curMonth()?'miss':'open'):(+v>=+g.target?'met':'miss');return `<i class="${st}" title="${monLabel(m)}: ${v==null||v===''?'–':fmtNum(v)+' '+esc(g.unit||'')}"></i>`}).join(''):`<i class="fill" style="flex:none;width:${goalProgress(g)}%"></i>`}</div>
      <div class="gt-today" style="left:${pos(today())}%"></div></div><div class="gt-pct">${goalProgress(g)} %</div></div>`}).join('')}
    </div>
    <div class="gt-legend"><span><i class="met"></i>erreicht</span><span><i class="miss"></i>verfehlt</span><span><i class="open"></i>offen</span><span><i class="today"></i>Heute</span></div>
  </div>`;
}
function goalCard(g,big){
  const st=goalSteps(g.id),done=st.filter(t=>t.done),p=goalProgress(g),ms=goalMonths(g);
  if(!editing.ziele){
    const monthly=measurable(g)&&g.rhythm==='monat';
    const fd=x=>new Date(x+'T12:00').toLocaleDateString('de-DE');
    const sec=(h,body)=>body?`<div class="gsec"><div class="gh">${h}</div>${body}</div>`:'';
    return `<div class="card ${big?'mission':''} goal-view" style="${big?'margin:0':''}">
      ${big?'<span class="label" style="display:block">Mein Masterziel</span>':''}
      <div class="gtitle" style="font-size:${big?24:18}px">${esc(g.title)}</div>
      <div class="gsplit">
        ${sec('Messgröße',measurable(g)?`${esc(g.metric)}: <b>${fmtNum(g.target)} ${esc(g.unit||'')}</b>${monthly?' pro Monat':''}`:'')}
        ${sec('Zeitraum',g.start&&g.deadline?`${fd(g.start)} – ${fd(g.deadline)}`:g.deadline?`bis ${fd(g.deadline)}`:'')}
      </div>
      ${sec('Warum',g.why?esc(g.why):'')}
      ${sec('Dadurch ändert sich mein Leben wie folgt',visionLines(g).length?`<ul>${visionLines(g).map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'')}
      ${sec('Zielerreichung',`<div class="bar" style="margin:4px 0 6px"><i style="width:${p}%"></i></div>
        <div style="font-size:13.5px;opacity:.8">${p} % erreicht · ${done.length} Aufgaben in den letzten 30 Tagen erledigt</div>
        ${monthly&&ms.length?`<div class="months" style="margin-top:10px">${ms.map(m=>{const v=(g.months||{})[m];const fut=m>curMonth();return `<label class="mcell ${v!=null&&v!==''?(+v>=+g.target?'met':'miss'):''}"><span>${monLabel(m)}</span><input type="number" inputmode="decimal" data-mv="${g.id}|${m}" value="${v??''}" placeholder="${fut?'–':'?'}" ${fut?'disabled':''}></label>`}).join('')}</div><div style="font-size:12.5px;opacity:.6;margin-top:6px">Am Monatsende Ergebnis eintragen (${esc(g.unit||'')}).</div>`:''}
        ${measurable(g)&&!monthly?`<div class="row" style="margin:8px 0 0"><span style="font-size:13px;opacity:.8">Aktueller Stand</span><input type="number" data-cur="${g.id}" value="${g.current??''}" style="width:120px"><span style="font-size:13px;opacity:.8">/ ${fmtNum(g.target)} ${esc(g.unit||'')}</span></div>`:''}`)}
      ${sec('Was mich abhält',g.obstacle?esc(g.obstacle):'')}
      ${sec('Mein Plan',g.plan?esc(g.plan):'')}
    </div>`;
  }
  const f=(k,ph,extra='')=>`<input type="text" data-f="${g.id}|${k}" value="${esc(g[k]??'')}" placeholder="${ph}" ${extra}>`;
  return `<div class="card goal-edit" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">${big?'Masterziel':'Optionales Ziel'}</span><button class="x" data-del="${g.id}" title="Löschen">×</button></div>
    <div><label class="l">S – Was genau will ich erreichen?</label>${f('title','z. B. Trading: konstant monatlich auszahlen')}</div>
    <div><label class="l">M – Woran messe ich es?</label>
      <div class="row" style="flex-wrap:wrap;margin:0">${f('metric','z. B. Auszahlung (17 Konten)','style="flex:2;min-width:160px"')}
        <input type="number" data-f="${g.id}|target" value="${esc(g.target??'')}" placeholder="Zielwert" style="width:110px">
        ${f('unit','$ / € / kg / km','style="width:90px"')}
        <select data-f="${g.id}|rhythm" style="width:130px"><option value="monat" ${g.rhythm==='monat'?'selected':''}>pro Monat</option><option value="gesamt" ${g.rhythm!=='monat'?'selected':''}>insgesamt</option></select></div>
      ${!measurable(g)?`<div class="row" style="margin:8px 0 0"><span class="meta">Nicht messbar? Fortschritt per Hand:</span><input type="range" min="0" max="100" step="5" value="${g.progress||0}" data-g="${g.id}" style="flex:1"><span class="meta" id="p-${g.id}">${g.progress||0} %</span></div>`:''}</div>
    <div><label class="l">A/R – Warum ist mir das wichtig?</label>${f('why','z. B. Freiheit über meine Zeit')}</div>
    ${big?`<div><label class="l">Dadurch ändert sich mein Leben wie folgt: <span class="meta">(eine Zeile pro Punkt)</span></label><textarea data-f="${g.id}|vision" placeholder="z. B. Ich bestimme selbst über meine Zeit …">${esc(g.vision||'')}</textarea></div>`:''}
    <div><label class="l">T – Zeitraum</label><div class="row" style="margin:0;flex-wrap:wrap"><span class="meta">von</span><input type="date" data-f="${g.id}|start" value="${esc(g.start||'')}" style="width:auto"><span class="meta">bis</span><input type="date" data-f="${g.id}|deadline" value="${esc(g.deadline||'')}" style="width:auto"></div></div>
    <div class="woop-edit"><label class="l">Was wird mich am ehesten davon abhalten?</label>${f('obstacle','z. B. Abends Bier und Shorts – am nächsten Morgen unkonzentriert')}
      <label class="l" style="margin-top:10px">Wenn-dann-Plan</label>${f('plan','Wenn … dann … – z. B. Wenn ich abends Lust auf Bier habe, trinke ich Alkoholfreies und lege das Handy in die Küche.')}</div>
    ${!big?`<button class="btn ghost small" data-master="${g.id}" style="align-self:flex-start">Zum Masterziel machen</button>`:''}
  </div>`;
}
function viewZiele(){
  const m=masterGoal(),opt=S.goals.filter(g=>g!==m);
  M.innerHTML=`
  <div class="section-head"><div><h1>Meine Ziele</h1><p>Ein Ziel, das alles verändert. Dazu höchstens zwei, die es tragen.</p></div>${editBtn('ziele')}</div>

  L.forEach((x,i)=>{const st=hm(x.time),en=x.end?hm(x.end):(L[i+1]?hm(L[i+1].time):st+60);if(cur>=st&&cur<en)now=x;if(st>cur&&!next)next=x});return{now,next}}

const editBtn=k=>`<button class="edit-btn ${editing[k]?'on':''}" data-edit="${k}">${editing[k]?'✓ Fertig':'✎ Bearbeiten'}</button>`;
function bindEdit(k,fn){M.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing[k]=!editing[k];fn()})}
let range='woche',aiReview={woche:'',monat:'',jahr:''},reviewBusy=false;
function rangeDates(){
  const now=new Date();let dates=[],cols=[];
  if(range==='woche'){dates=weekDays();cols=dates.map(d=>({l:new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'short'}),ds:[d]}))}
  else if(range==='monat'){const y=now.getFullYear(),m=now.getMonth(),n=new Date(y,m+1,0).getDate();dates=[...Array(n)].map((_,i)=>iso(new Date(y,m,i+1)));cols=dates.map(d=>({l:(+d.slice(8)===1||+d.slice(8)%5===0)?String(+d.slice(8)):'',ds:[d]}))}
  else{const y=now.getFullYear();for(let m=0;m<12;m++){const n=new Date(y,m+1,0).getDate();const ds=[...Array(n)].map((_,i)=>iso(new Date(y,m,i+1)));dates.push(...ds);cols.push({l:new Date(y,m,1).toLocaleDateString('de-DE',{month:'short'}),ds})}}
  return{dates,cols,past:dates.filter(d=>d<=today())};
}
function dayScore(d){const x=S.days[d];if(!x||!S.habits.length)return null;const pos=S.habits.filter(h=>x.habits?.[h.id]===true).length;return pos/S.habits.length}
function filled(d){const x=S.days[d];return x&&(x.goal||x.grat.some(Boolean)||x.good||x.win||x.tasks.some(t=>t.t)||Object.keys(x.habits||{}).length)}
function md(t){
  const lines=esc(t).split('\n');let out='',inList=false;
  lines.forEach(l=>{l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^\s*[-•*]\s+/.test(l)){if(!inList){out+='<ul>';inList=true}out+='<li>'+l.replace(/^\s*[-•*]\s+/,'')+'</li>';return}
    if(inList){out+='</ul>';inList=false}
    if(/^#{1,4}\s/.test(l))out+='<h4>'+l.replace(/^#{1,4}\s/,'')+'</h4>';else if(l.trim())out+='<p>'+l+'</p>'});
  if(inList)out+='</ul>';return out;
}

  </div>

  <div class="kpis">
    <div class="kpi"><small>Wort gehalten</small><b>${past.filter(kept).length}<span style="font-size:15px;color:var(--muted)"> / ${past.filter(d=>S.days[d]?.committed).length} Zusagen</span></b></div>
    <div class="kpi"><small>Ziel-Aufgaben erledigt</small><b>${stepsDone}<span style="font-size:15px;color:var(--muted)"> / ${steps.length}</span></b></div>
    <div class="kpi"><small>Durch Verzicht gewonnen</small><b style="font-size:20px">${euro?euro+' €':''}${euro&&mins?' · ':''}${mins?fmtSaved(mins,'Min.'):''}${!euro&&!mins?'–':''}</b></div>
    <div class="kpi"><small>Ø Stimmung</small><b>${moodAvg?['😞','😕','😐','🙂','😄'][Math.round(moodAvg)-1]:'–'}</b></div>
  </div>

  <div class="grid">
    <div class="card full"><h3>Tagesbilanz</h3><p class="hint">Anteil erfüllter Gewohnheiten pro ${range==='jahr'?'Monat':'Tag'} (Tun + Verzicht)</p>
      <div class="chart">${cols.map((c,i)=>`<div class="col" title="${Math.round(colVals[i]*100)} %"><i style="height:${Math.max(2,colVals[i]*100)}%"></i><span>${c.l}</span></div>`).join('')}</div></div>
    <div class="card"><h3>Das tue ich</h3><p class="hint">Erledigt vs. dein Wochenziel</p>
      ${doH.map(h=>{const n=past.filter(d=>S.days[d]?.habits?.[h.id]===true).length;const goal=Math.round(h.target*weeks);const p=goal?Math.min(100,Math.round(n/goal*100)):0;
        return `<div class="hrow"><span>${h.icon} ${esc(h.name)}</span><div class="bar"><i style="width:${p}%"></i></div><span class="meta">${n}/${goal}</span></div>`}).join('')||'<p class="empty">–</p>'}</div>
    <div class="card"><h3>Darauf verzichte ich</h3><p class="hint">Standhafte Tage im Zeitraum</p>
      ${avH.map(h=>{const ok=past.filter(d=>S.days[d]?.habits?.[h.id]===true).length,sl=past.filter(d=>S.days[d]?.habits?.[h.id]===false).length;const p=past.length?Math.round(ok/past.length*100):0;
        return `<div class="hrow"><span>${h.icon} ${esc(h.name)}</span><div class="bar"><i style="width:${p}%;background:var(--ok)"></i></div><span class="meta">${ok} ✓ ${sl?`· ${sl} ✗`:''}</span></div>`}).join('')||'<p class="empty">–</p>'}</div>
    <div class="card"><h3>Ablenkungen</h3><p class="hint">Was hat dich vom Wesentlichen abgehalten?</p>
      ${dl().map(x=>{const n=past.filter(d=>S.days[d]?.distr?.includes(x[0])).length;const p=past.length?Math.round(n/past.length*100):0;
        return `<div class="hrow"><span>${x[1]}</span><div class="bar"><i style="width:${p}%;background:var(--slip)"></i></div><span class="meta">${n}×</span></div>`}).join('')}
      ${(()=>{const ms=past.map(d=>minsBetween(S.days[d]?.bed,S.days[d]?.phoneOff)).filter(m=>m!==null);if(!ms.length)return '';const s=ms.reduce((a,b)=>a+b,0);
        return `<p class="slip-msg">📱 Handy im Bett: <b>${Math.round(s/6)/10} Std.</b> gesamt (Ø ${Math.round(s/ms.length)} Min. pro Abend)</p>`})()}
    </div>
    <div class="card"><h3>Aufgaben pro Ziel</h3><p class="hint">Wie viel hast du konkret für deine Ziele getan?</p>
      ${S.goals.map(g=>{const st=past.flatMap(d=>(S.days[d]?.tasks||[]).filter(t=>t.goal===g.id&&t.t));const dn=st.filter(t=>t.done).length;
        return `<div class="hrow"><span>🎯 ${esc(g.title)}</span><div class="bar"><i style="width:${st.length?Math.round(dn/st.length*100):0}%"></i></div><span class="meta">${dn}/${st.length}</span></div>`}).join('')||'<p class="empty">–</p>'}
    </div>
    <div class="card"><h3>Deine Erfolge</h3><p class="hint">Das hast du geschafft</p>
      ${past.filter(d=>S.days[d]?.win).reverse().slice(0,8).map(d=>`<div class="row" style="align-items:flex-start"><span class="meta" style="width:46px;flex-shrink:0">${short(d)}</span><span style="font-size:14px">⭐ ${esc(S.days[d].win)}</span></div>`).join('')||'<p class="empty">Noch keine Erfolge eingetragen.</p>'}
    </div>
    <div class="card"><h3>Dankbarkeit</h3><p class="hint">Deine letzten Einträge</p>
      ${past.flatMap(d=>(S.days[d]?.grat||[]).filter(Boolean).map(g=>({d,g}))).slice(-6).reverse().map(x=>`<div class="row" style="align-items:flex-start"><span class="meta" style="width:46px;flex-shrink:0">${short(x.d)}</span><span style="font-size:14px">${esc(x.g)}</span></div>`).join('')||'<p class="empty">Noch keine Einträge.</p>'}
    </div>
  </div>`;
  bind('[data-r]',el=>{range=el.dataset.r;viewReport()},'click');
  M.querySelector('#aiRev').onclick=runReview;
}

/* =========================================================
   Render
   ========================================================= */
/* =========================================================
   Einstellungen
   ========================================================= */
function viewSettings(){
  const L=[
    ['verbindlich','Verbindlich','Klar und ernst, ohne Spielerei. Ein goldener Faden führt durch deinen Tag.'],
    ['tageszeit','Tageszeit','Szene und Farben wechseln mit Sonnenaufgang, Tag, Abend und Nacht.'],
    ['ruhig','Ruhig','Kleine, blasse Szene, weniger Farbe – nur das Wesentliche.'],
    ['dunkel','Dunkel','Dunkler Hintergrund, angenehm am Abend und im Bett.']
  ];
  M.innerHTML=`
  <div class="section-head"><div><h1>Einstellungen</h1><p>Mach die Seite zu deiner.</p></div></div>
  <div class="grid">
    <div class="card">
      <h3>Layout</h3><p class="hint">Wie soll dein Journal aussehen?</p>
      ${L.map(l=>`<div class="layout-opt ${S.settings.layout===l[0]?'on':''}" data-l="${l[0]}">
        <div class="sw" style="${l[0]==='dunkel'?'background:#16181d':l[0]==='ruhig'?'background:#f3efe9':l[0]==='verbindlich'?'background:linear-gradient(90deg,#f3f0e8 0 40%,#b08d3c 40% 44%,#1c2230 44%)':''}">${l[0]==='tageszeit'?scene(phase,true):''}</div>
        <div><b>${l[1]}</b><div class="meta" style="margin-top:3px;line-height:1.4">${l[2]}</div></div></div>`).join('')}
    </div>
    <div class="stack">
      <div class="card">
        <h3>Abend beginnt um</h3><p class="hint">Ab dieser Uhrzeit klappt die Abendreflexion auf „Mein Tag“ automatisch auf.</p>
        <select id="sEve" style="width:120px">${[15,16,17,18,19,20,21].map(h=>`<option value="${h}" ${S.settings.evening===h?'selected':''}>${h}:00 Uhr</option>`).join('')}</select>
      </div>
      <div class="card">
        <h3>Ablenkungen verwalten</h3><p class="hint">Diese Auswahl erscheint in der Abendreflexion.</p>
        ${dl().map(x=>`<div class="row"><span style="flex:1">${esc(x[1])}</span><button class="x" data-ddel="${x[0]}">×</button></div>`).join('')}
      </div>
      <div class="card">
        <h3>Dein Name</h3><p class="hint">Für die Begrüßung.</p>
        <input type="text" id="sName" value="${esc(S.name)}">
      </div>
      <div class="card">
        <h3>Datensicherung</h3><p class="hint">Einmal im Monat exportieren – die Datei ist deine Sicherung.</p>
        <div class="row" style="flex-wrap:wrap"><button class="btn" id="exp">⬇ Daten exportieren</button><label class="btn ghost" style="cursor:pointer">⬆ Importieren<input type="file" id="imp" accept="application/json" style="display:none"></label></div>
        <details style="margin-top:12px"><summary class="meta" style="cursor:pointer">Daten aus der Claude-Version übernehmen</summary>
          <textarea id="impTxt" placeholder="Hier den kopierten Text einfügen …" style="margin-top:8px;min-height:80px"></textarea>
          <button class="btn small" id="impGo" style="margin-top:8px">Übernehmen</button></details>
      </div>
      ${SB?`<div class="card"><h3>Konto</h3><p class="hint">${cloud?'Angemeldet und synchronisiert.':'Nicht angemeldet.'}</p><button class="btn ghost" id="logout">Abmelden</button></div>`:''}
    </div>
  </div>`;
  bind('[data-l]',el=>{S.settings.layout=el.dataset.l;markMeta();render()},'click');
  bind('#sEve',el=>{S.settings.evening=+el.value;markMeta()},'change');
  bind('#sName',el=>{S.name=el.value;markMeta()});
  bind('#exp',()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='erfolgsjournal-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},'click');
  bind('#imp',el=>{const f=el.files[0];if(!f)return;f.text().then(t=>{try{const n=normalize(JSON.parse(t));S=n;markMeta();Object.keys(S.days).forEach(d=>dirty.add('d-'+d));schedule();toast('Import erfolgreich.');render()}catch(e){toast('Datei konnte nicht gelesen werden.')}})},'change');
  bind('#impGo',()=>{try{S=normalize(JSON.parse(M.querySelector('#impTxt').value));markMeta();Object.keys(S.days).forEach(d=>dirty.add('d-'+d));schedule();toast('Übernommen ✓');render()}catch(e){toast('Text konnte nicht gelesen werden.')}},'click');
  bind('#logout',async()=>{await SB.auth.signOut();try{localStorage.removeItem(LKEY)}catch(e){}location.reload()},'click');
  bind('[data-ddel]',el=>{S.distractions=S.distractions.filter(x=>x[0]!==el.dataset.ddel);markMeta();viewSettings()},'click');
}

/* =========================================================
   Sprach-Fenster (Button unten rechts)
   ========================================================= */
let sheetOpen=false;
function renderSheet(){
  let fab=document.getElementById('fab');
  if(!fab){fab=document.createElement('button');fab.id='fab';fab.className='fab';fab.title='Tag einsprechen';fab.innerHTML='🎙️';fab.onclick=()=>{sheetOpen=true;renderSheet()};document.body.appendChild(fab)}
  fab.style.display=page==='tag'&&!sheetOpen?'grid':'none';
  let bg=document.getElementById('sheet');
  if(!sheetOpen){if(bg)bg.remove();return}
  if(!bg){bg=document.createElement('div');bg.id='sheet';bg.className='sheet-bg';bg.onclick=e=>{if(e.target===bg){sheetOpen=false;renderSheet()}};document.body.appendChild(bg)}
  bg.innerHTML=`<div class="card voice sheet">
      <div style="display:flex;justify-content:space-between;align-items:center"><h3>🎙️ Sprich deinen Tag ein</h3><button class="x" id="sheetX" style="color:#cfc4b6">×</button></div>
      <p class="hint">Einfach drauflos: „Mein Fokus heute ist … Dankbar bin ich für … Die zwei Aufgaben für mein Ziel sind … Auf Bier habe ich verzichtet …“ – ich trage alles an die richtige Stelle ein.</p>
      <textarea id="voice" placeholder="${dictation?'Tippe auf „Einsprechen“ oder schreib hier …':'Hier schreiben – oder am Handy die Mikrofon-Taste der Tastatur nutzen …'}">${esc(voiceText)}</textarea>
      <div class="row" style="margin:12px 0 0;flex-wrap:wrap">
        ${dictation?`<button class="btn ${recording?'rec':''}" id="mic">${recording?'⏹ Stopp':'🎙️ Einsprechen'}</button>`:''}
        <button class="btn" id="aiFill" ${aiBusy?'disabled':''}>${aiBusy?'⏳ Wird eingetragen …':'✨ Eintragen'}</button>
      </div>
      ${lastApplied?`<p class="info-msg" style="background:rgba(255,255,255,.1);color:#fff">${esc(lastApplied)}</p>`:''}
    </div>`;
  bg.querySelector('#sheetX').onclick=()=>{sheetOpen=false;if(recording&&dictation)dictation.stop().catch(()=>{});renderSheet()};
  bg.querySelector('#voice').oninput=e=>{voiceText=e.target.value};
  const mic=bg.querySelector('#mic');if(mic)mic.onclick=toggleDictation;
  bg.querySelector('#aiFill').onclick=aiFill;
}

function sober(){if(S.settings.layout!=='verbindlich')return;M.querySelectorAll('h3,.now-label').forEach(h=>{const n=h.firstChild;if(n&&n.nodeType===3)n.textContent=n.textContent.replace(/^[\p{Extended_Pictographic}\uFE0F\u200d\s]+/u,'')})}
viewTag=(f=>()=>{f();sober()})(viewTag);viewZiele=(f=>()=>{f();sober()})(viewZiele);viewGew=(f=>()=>{f();sober()})(viewGew);viewWerte=(f=>()=>{f();sober()})(viewWerte);viewReport=(f=>()=>{f();sober()})(viewReport);viewSettings=(f=>()=>{f();sober()})(viewSettings);viewIdeal=(f=>()=>{f();sober()})(viewIdeal);
function render(){applyPhase();renderNav();({tag:viewTag,ziele:viewZiele,gew:viewGew,werte:viewWerte,report:viewReport,settings:viewSettings,ideal:viewIdeal})[page]();sober();renderSheet()}
render();
renderSave();
initCloud();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{if(!phaseManual){const p=autoPhase();if(p!==phase){phase=p;if(!M.contains(document.activeElement))render()}}},60000);
</script>
</body>
