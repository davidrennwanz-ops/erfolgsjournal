const editBtn=k=>`<button class="edit-btn ${editing[k]?'on':''}" data-edit="${k}">${editing[k]?'✓ Fertig':'✎ Bearbeiten'}</button>`;
function bindEdit(k,fn){M.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing[k]=!editing[k];fn()})}
let range='woche',aiReview={woche:'',monat:'',jahr:''},reviewBusy=false;
function rangeDates(){
  const now=new Date();let dates=[],cols=[];
  if(range==='woche'){dates=weekDays();cols=dates.map(d=>({l:new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'short'}),ds:[d]}))}
  else if(range==='monat'){const y=now.getFullYear(),m=now.getMonth(),n=new Date(y,m+1,0).getDate();dates=[...Array(n)].map((_,i)=>iso(new Date(y,m,i+1)));cols=dates.map(d=>({l:(+d.slice(8)===1||+d.slice(8)%5===0)?String(+d.slice(8)):'',ds:[d]}))}
  else{const y=now.getFullYear();for(let m=0;m<12;m++){const n=new Date(y,m+1,0).getDate();const ds=[...Array(n)].map((_,i)=>iso(new Date(y,m,i+1)));dates.push(...ds);cols.push({l:new Date(y,m,1).toLocaleDateString('de-DE',{month:'short'}),ds})}}
  return{dates,cols,past:dates.filter(d=>d<=today())};
}
function dayScore(d){const x=S.days[d];if(!x||!S.habits.length)return null;const pos=S.habits.filter(h=>x.habits?.[h.id]===true).length;return pos/S.habits.length}
function filled(d){const x=S.days[d];return x&&(x.goal||x.grat.some(Boolean)||x.good||x.win||x.tasks.some(t=>t.t)||Object.keys(x.habits||{}).length)}
function md(t){
  const lines=esc(t).split('\n');let out='',inList=false;
  lines.forEach(l=>{l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^\s*[-•*]\s+/.test(l)){if(!inList){out+='<ul>';inList=true}out+='<li>'+l.replace(/^\s*[-•*]\s+/,'')+'</li>';return}
    if(inList){out+='</ul>';inList=false}
    if(/^#{1,4}\s/.test(l))out+='<h4>'+l.replace(/^#{1,4}\s/,'')+'</h4>';else if(l.trim())out+='<p>'+l+'</p>'});
  if(inList)out+='</ul>';return out;
}
async function runReview(){
  if(reviewBusy)return;
  if(!SB||!cloud){toast(aiMsg({code:'no_ai'}),4000);return}
  const {past}=rangeDates();
  const data=past.filter(filled).map(d=>{const x=S.days[d];return{datum:d,zusage:x.committed?('um '+x.committed+(kept(d)?' – gehalten':' – nicht gehalten')):'keine',fokus:x.goal,dankbar:x.grat.filter(Boolean),aufgaben:x.tasks.filter(t=>t.t).map(t=>({schritt:t.t,erledigt:t.done,ziel:goalById(t.goal)?.title||''})),
    gewohnheiten:Object.fromEntries(S.habits.filter(h=>x.habits?.[h.id]!==undefined).map(h=>[h.name,h.type==='avoid'?(x.habits[h.id]?'verzichtet':'Ausrutscher'):'erledigt'])),
    ablenkungen:x.distr.map(k=>dl().find(z=>z[0]===k)?.[1]),notiz:x.distrNote,imBett:x.bed,handyWeg:x.phoneOff,erfolg:x.win,gut:x.good,besser:x.learn,stimmung:x.mood||null}});
  if(!data.length){toast('Für diesen Zeitraum gibt es noch keine Einträge.');return}
  reviewBusy=true;aiReview[range]='';viewReport();
  const label=range==='woche'?'diese Woche':range==='monat'?'diesen Monat':'dieses Jahr';
  const prompt=`Du bist ein klarer, warmherziger Coach (Deutsch, Du-Form, keine Floskeln, kein Moralisieren). Werte das Erfolgsjournal von ${esc(S.name)} für ${label} aus.

Ziele: ${JSON.stringify(S.goals.map(g=>({masterziel:!!g.master,ziel:g.title,warum:g.why,fortschritt:g.progress+'%'})))}
Gewohnheiten: ${JSON.stringify(S.habits.map(h=>({name:h.name,art:h.type==='avoid'?'verzichten':'tun',wochenziel:h.target})))}
Tageseinträge: ${JSON.stringify(data)}

Schreibe kurz (max. 220 Wörter) in genau diesen Abschnitten mit "### " als Überschrift:
### Was richtig gut lief
(2–3 Punkte, konkret mit Zahlen/Tagen)
### Muster, die mir auffallen
(2–3 Punkte: Zusammenhänge, z. B. Alkohol ↔ spät ins Bett ↔ Stimmung/erledigte Aufgaben am nächsten Tag. Nur was die Daten hergeben.)
### Dein Fokus für die nächste Woche
(1 konkrete, kleine Maßnahme + 1 Satz, der an sein Warum erinnert)
Ausrutscher sachlich benennen, nie beschämen.`;
  try{
    await aiText(prompt,({text})=>{aiReview[range]=text;const el=M.querySelector('#aiOut');if(el)el.innerHTML=md(text)});
  }catch(e){aiReview[range]='';toast(aiMsg(e),4000)}

}

  {p:'gew',s:'.nav-btn[data-p="gew"]',t:'Gewohnheiten',x:'Was du <b>tun</b> willst (z. B. 3× pro Woche Sport) und worauf du <b>verzichtest</b> (z. B. Social Media am Abend). Ein Ausrutscher löscht keinen Fortschritt – du siehst „23 von 30 Tagen“.'},
  {p:'ideal',s:'.nav-btn[data-p="ideal"]',t:'Mein idealer Tag',x:'Wie sähe dein Tag aus, wenn dein Ziel erreicht ist? Hier legst du ihn mit Uhrzeiten an – als Bild, für das du arbeitest.'},
  {p:'report',s:'.nav-btn[data-p="report"]',t:'Reports',x:'Woche, Monat, Jahr: Was lief gut, was hat dich abgelenkt, wie viele Aufgaben für dein Ziel hast du erledigt.'},
  {p:'settings',s:'.nav-btn[data-p="settings"]',t:'Einstellungen',x:'Layout, eigene Ablenkungen, Datensicherung – und hier kannst du diese Tour jederzeit erneut starten.'},
  {t:'Los geht’s',x:'Am wichtigsten ist dein <b>Masterziel</b>. Leg es jetzt an – die Beispiele kannst du einfach überschreiben.',final:true}
];
let tourI=-1;
function startTour(){tourI=0;showTour()}
function endTour(){tourI=-1;['tourHole','tourCard'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove()});if(!S.settings.tutorialDone){S.settings.tutorialDone=true;markMeta()}}
function showTour(){
  const st=TOUR[tourI];if(!st){endTour();return}
  if(st.p&&page!==st.p){page=st.p;location.hash=page;render()}
  if(st.p==='tag'&&!st.s.startsWith('.nav'))window.scrollTo(0,0);
  let hole=document.getElementById('tourHole');if(!hole){hole=document.createElement('div');hole.id='tourHole';hole.className='tour-hole';document.body.appendChild(hole)}
  let card=document.getElementById('tourCard');if(!card){card=document.createElement('div');card.id='tourCard';card.className='tour-card';document.body.appendChild(card)}
  const el=st.s?[...document.querySelectorAll(st.s)].find(e=>e.offsetParent!==null||getComputedStyle(e).position==='fixed'):null;
  if(el&&el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'instant'});
  card.innerHTML=`<div class="tour-step">${tourI+1} / ${TOUR.length}</div><h3>${st.t}</h3><p>${st.x}</p>
    ${st.name?`<input type="text" id="tourName" placeholder="Wie heißt du? (für die Begrüßung)" value="${esc(S.name||'')}" style="margin:4px 0 12px">`:''}
    <div class="tour-btns">${st.final?`<button class="btn ghost small" id="tourDay">Erst mal umschauen</button><button class="btn" id="tourGoal">Masterziel anlegen</button>`:`${tourI>0?'<button class="btn ghost small" id="tourBack">Zurück</button>':'<button class="btn ghost small" id="tourSkip">Überspringen</button>'}<button class="btn" id="tourNext">Weiter</button>`}</div>`;
  const place=()=>{
    if(el){const r=el.getBoundingClientRect(),pad=6;Object.assign(hole.style,{display:'block',left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
      const below=r.top+r.height/2<innerHeight/2;card.style.top=below?Math.min(innerHeight-card.offsetHeight-16,r.bottom+16)+'px':'';card.style.bottom=below?'':Math.max(16,innerHeight-r.top+16)+'px'}
    else{Object.assign(hole.style,{display:'block',left:'50%',top:'45%',width:'0px',height:'0px'});card.style.top=Math.max(16,(innerHeight-card.offsetHeight)/2)+'px';card.style.bottom=''}
  };
  setTimeout(place,60);
  const q=id=>card.querySelector('#'+id);
  const saveName=()=>{const n=q('tourName');if(n){S.name=n.value.trim();markMeta();renderNav();if(page==='tag')render()}};
  if(q('tourNext'))q('tourNext').onclick=()=>{saveName();tourI++;showTour()};
  if(q('tourBack'))q('tourBack').onclick=()=>{tourI--;showTour()};
  if(q('tourSkip'))q('tourSkip').onclick=()=>{saveName();endTour();page='tag';location.hash='tag';render()};
  if(q('tourDay'))q('tourDay').onclick=()=>{endTour();page='tag';location.hash='tag';render()};
  if(q('tourGoal'))q('tourGoal').onclick=()=>{endTour();editing.ziele=true;page='ziele';location.hash='ziele';render();window.scrollTo(0,0)};
}
addEventListener('resize',()=>{if(tourI>=0)showTour()});

/* =========================================================
   Sprach-Fenster (Button unten rechts)
   ========================================================= */
let sheetOpen=false;
function renderSheet(){
  let fab=document.getElementById('fab');
  if(!fab){fab=document.createElement('button');fab.id='fab';fab.className='fab';fab.title='Tag einsprechen';fab.innerHTML='🎙️';fab.onclick=()=>{sheetOpen=true;renderSheet()};document.body.appendChild(fab)}
  fab.style.display=page==='tag'&&!sheetOpen?'grid':'none';
  let bg=document.getElementById('sheet');
  if(!sheetOpen){if(bg)bg.remove();return}
  if(!bg){bg=document.createElement('div');bg.id='sheet';bg.className='sheet-bg';bg.onclick=e=>{if(e.target===bg){sheetOpen=false;renderSheet()}};document.body.appendChild(bg)}
  bg.innerHTML=`<div class="card voice sheet">
      <div style="display:flex;justify-content:space-between;align-items:center"><h3>🎙️ Sprich deinen Tag ein</h3><button class="x" id="sheetX" style="color:#cfc4b6">×</button></div>
      <p class="hint">Einfach drauflos: „Mein Fokus heute ist … Dankbar bin ich für … Die zwei Aufgaben für mein Ziel sind … Auf Bier habe ich verzichtet …“ – ich trage alles an die richtige Stelle ein.</p>
      <textarea id="voice" placeholder="${dictation?'Tippe auf „Einsprechen“ oder schreib hier …':'Hier schreiben – oder am Handy die Mikrofon-Taste der Tastatur nutzen …'}">${esc(voiceText)}</textarea>
      <div class="row" style="margin:12px 0 0;flex-wrap:wrap">
        ${dictation?`<button class="btn ${recording?'rec':''}" id="mic">${recording?'⏹ Stopp':'🎙️ Einsprechen'}</button>`:''}
        <button class="btn" id="aiFill" ${aiBusy?'disabled':''}>${aiBusy?'⏳ Wird eingetragen …':'✨ Eintragen'}</button>
      </div>
      ${lastApplied?`<p class="info-msg" style="background:rgba(255,255,255,.1);color:#fff">${esc(lastApplied)}</p>`:''}
    </div>`;
  bg.querySelector('#sheetX').onclick=()=>{sheetOpen=false;if(recording&&dictation)dictation.stop().catch(()=>{});renderSheet()};
  bg.querySelector('#voice').oninput=e=>{voiceText=e.target.value};
  const mic=bg.querySelector('#mic');if(mic)mic.onclick=toggleDictation;
  bg.querySelector('#aiFill').onclick=aiFill;
}

function sober(){if(S.settings.layout!=='verbindlich')return;M.querySelectorAll('h3,.now-label').forEach(h=>{const n=h.firstChild;if(n&&n.nodeType===3)n.textContent=n.textContent.replace(/^[\p{Extended_Pictographic}\uFE0F\u200d\s]+/u,'')})}
viewTag=(f=>()=>{f();sober()})(viewTag);viewZiele=(f=>()=>{f();sober()})(viewZiele);viewGew=(f=>()=>{f();sober()})(viewGew);viewWerte=(f=>()=>{f();sober()})(viewWerte);viewReport=(f=>()=>{f();sober()})(viewReport);viewSettings=(f=>()=>{f();sober()})(viewSettings);viewIdeal=(f=>()=>{f();sober()})(viewIdeal);
function render(){applyPhase();renderNav();({tag:viewTag,ziele:viewZiele,gew:viewGew,werte:viewWerte,report:viewReport,settings:viewSettings,ideal:viewIdeal})[page]();sober();renderSheet()}
render();
renderSave();
initCloud();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{if(!phaseManual){const p=autoPhase();if(p!==phase){phase=p;if(!M.contains(document.activeElement))render()}}},60000);
</script>
