<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erfolgsjournal</title>
<meta name="theme-color" content="#1c2230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f2; --panel:#ffffff; --ink:#2a2620; --muted:#8a8178; --line:#ece4da;
  --accent:#e8774a; --accent-soft:#fde8dc; --ok:#4f9d69; --slip:#d9776b;
  --side:#2a2620; --side-ink:#f4ede4; --r:16px;
}
body.p-tag{--accent:#2f8fd1;--accent-soft:#e2f1fb;--bg:#f5f9fc}
body.p-abend{--accent:#c2527a;--accent-soft:#f8e1ea;--bg:#faf5f7}
body.p-nacht{--accent:#6b7fd7;--accent-soft:#e6e9fa;--bg:#f3f4f9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .6s}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0}
.app{display:flex;min-height:100vh}
nav.side{width:232px;background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.brand-mark{width:34px;height:34px;border-radius:10px;overflow:hidden;flex-shrink:0;position:relative}
.brand-mark svg{position:absolute;inset:0;width:100%;height:100%}
.brand b{font-family:Newsreader,serif;font-size:18px}
.brand small{display:block;color:#a99f93;font-size:11px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8f857a;padding:14px 12px 6px}
.nav-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14.5px;color:#d9d0c5;transition:.15s}
.nav-btn svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-btn:hover{background:#3a352e;color:#fff}
.nav-btn.active{background:var(--accent);color:#fff}
.side-foot{margin-top:auto;font-size:11.5px;color:#8f857a;padding:10px 12px;line-height:1.5}
main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1100px}
.hero{position:relative;border-radius:22px;overflow:hidden;height:200px;margin-bottom:20px;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero-txt{position:absolute;left:28px;bottom:22px;right:28px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.hero-txt .date{font-size:13px;opacity:.9}
.hero-txt h1{font-size:34px;margin:4px 0 0}
.phase-switch{position:absolute;top:14px;right:14px;display:flex;gap:4px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);padding:4px;border-radius:999px}
.phase-switch button{all:unset;cursor:pointer;font-size:11.5px;color:#fff;padding:5px 10px;border-radius:999px}
.phase-switch button.on{background:rgba(255,255,255,.35)}
.quote{background:var(--panel);border-radius:var(--r);padding:18px 22px;margin-bottom:20px;border-left:4px solid var(--accent);display:flex;gap:16px;align-items:flex-start}
.quote p{font-family:Newsreader,serif;font-size:19px;margin:0 0 6px;line-height:1.4}
.quote span{color:var(--muted);font-size:13px}
.quote button{margin-left:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--panel);border-radius:var(--r);padding:20px 22px;border:1px solid var(--line)}
.card.full{grid-column:1/-1}
.card h3{font-size:17px;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.5}
.tag{font-family:Inter;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:999px}
input[type=text],input[type=number],textarea,select,input[type=date],input[type=time]{width:100%;font:inherit;font-size:14.5px;border:1px solid var(--line);background:#fffdfb;border-radius:10px;padding:10px 12px;color:var(--ink);outline:none;transition:.15s}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.chk{appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;transition:.15s;background:#fff;margin:0}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.btn{all:unset;cursor:pointer;background:var(--accent);color:#fff;font-size:13.5px;font-weight:500;padding:9px 15px;border-radius:10px;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:12.5px}
.btn.rec{background:#c0392b;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(192,57,43,.18)}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;background:#fff;transition:.15s}
.pill.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.slip{background:#fbe3e0;border-color:#e2928a;color:#9b3a31}
.moods{display:flex;gap:8px}
.mood{all:unset;cursor:pointer;font-size:24px;padding:6px 9px;border-radius:12px;filter:grayscale(1);opacity:.55;transition:.15s}
.mood.on{filter:none;opacity:1;background:var(--accent-soft)}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 20px;gap:12px;flex-wrap:wrap}
.section-head h1{font-size:30px}
.section-head p{color:var(--muted);margin:4px 0 0;font-size:14px}
.meta{color:var(--muted);font-size:12.5px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
input[type=range]{width:100%;accent-color:var(--accent)}
.week{display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(7,1fr) 64px;gap:6px;align-items:center;font-size:13.5px}
.week .h{color:var(--muted);font-size:11.5px;text-align:center}
.week .cell{display:grid;place-items:center}
.week .rate{text-align:right;color:var(--muted);font-size:12.5px}
.week .rate.hit{color:var(--ok);font-weight:600}
.tri{all:unset;cursor:pointer;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;background:#fff}
.tri.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tri.no{background:#fbe3e0;border-color:#e2928a;color:#9b3a31}
.tri[disabled]{opacity:.3;pointer-events:none}
.x{all:unset;cursor:pointer;color:#c9bfb4;font-size:18px;padding:0 4px}
.x:hover{color:#c0392b}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:12px}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;font-size:13.5px;color:var(--muted)}
.tabs button.on{background:var(--accent);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-family:Newsreader,serif;font-size:26px;margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .col i{width:100%;max-width:38px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px;opacity:.9}
.chart .col span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.hrow{display:grid;grid-template-columns:160px 1fr 70px;gap:12px;align-items:center;margin-bottom:10px;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.value{display:flex;gap:14px;align-items:flex-start}
.value .dot{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:Newsreader,serif;font-weight:700;font-size:18px;flex-shrink:0}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;font-size:13px;padding:9px 14px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;max-width:340px;z-index:30}
.toast.show{opacity:.94}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.l{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.proud{background:linear-gradient(135deg,var(--accent-soft),#fff 70%)}
.wins{display:flex;flex-wrap:wrap;gap:8px}
.win-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.warn{border-color:var(--accent);background:var(--accent-soft)}
.ok-msg,.slip-msg,.info-msg{margin:10px 0 0;padding:10px 13px;border-radius:10px;font-size:14px;line-height:1.5}
.ok-msg{background:#e3f2e8;color:#2f6b43}
.slip-msg{background:#fbe9e6;color:#8a3a30}
.info-msg{background:var(--accent-soft);color:var(--ink)}
.voice{background:linear-gradient(135deg,#2a2620,#4a3f35);color:#f4ede4;border:none}
.voice .hint{color:#cfc4b6}
.voice textarea{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff;min-height:84px}
.voice textarea::placeholder{color:#a99f93}
.voice .btn.ghost{color:#e8ddd0;border-color:rgba(255,255,255,.25)}
.avoid-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.avoid-stat{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.4}
.avoid-stat b{color:var(--ok)}
.task{display:grid;grid-template-columns:auto 1fr 170px;gap:10px;align-items:center;margin-bottom:10px}
.ai-out{font-size:14.5px;line-height:1.6}
.ai-out ul{padding-left:20px;margin:6px 0}
.ai-out h4{font-family:Newsreader,serif;font-size:15.5px;margin:12px 0 4px}
.ai-out p{margin:6px 0}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:#8f857a;display:inline-block}
.sync.on i{background:#6fcf8e}
/* Fokus-Karte */
.mission{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-bottom:20px;box-shadow:0 12px 30px -24px rgba(0,0,0,.4)}
.mission .goal-line{font-family:Newsreader,serif;font-size:22px;line-height:1.3;margin:2px 0 4px}
.mission .why{color:var(--muted);font-size:14px;margin-bottom:16px}
.countdown{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:12px;padding:11px 13px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.stat b{font-size:17px}
.verdict{font-size:15.5px;line-height:1.5;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.verdict.good{background:#e3f2e8;color:#2f6b43}
.verdict.alert{background:#fbe9e6;color:#8a3a30}
.now-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 12px;font-weight:600}
details.more{margin-top:22px}
details.more summary{cursor:pointer;list-style:none;color:var(--muted);font-size:14px;padding:12px 16px;border:1px dashed var(--line);border-radius:12px;text-align:center}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:20px}
/* Sprach-Button + Fenster */
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);z-index:20;display:grid;place-items:center}
.fab:hover{filter:brightness(1.08)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{width:100%;max-width:620px;margin-bottom:auto;margin-top:auto}
/* Layouts */
body.t-ruhig .hero{height:110px}
body.t-ruhig .hero svg.scene{opacity:.35}
body.t-ruhig .hero-txt{color:var(--ink);text-shadow:none}
body.t-ruhig .quote{border-left-color:var(--line)}
body.t-ruhig .proud{background:var(--panel)}
body.t-dunkel{--bg:#16181d!important;--panel:#1f2229!important;--ink:#ece8e1!important;--muted:#9a958c!important;--line:#2e323b!important;--side:#0f1115}
body.t-dunkel input,body.t-dunkel textarea,body.t-dunkel select{background:#262a32!important;color:#ece8e1}
body.t-dunkel .pill,body.t-dunkel .tri,body.t-dunkel .chk,body.t-dunkel .win-chip{background:#262a32}
body.t-dunkel .stat{background:#262a32}
body.t-dunkel .proud{background:var(--panel)}
.layout-opt{display:flex;gap:14px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;margin-bottom:10px}
.layout-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.layout-opt .sw{width:64px;height:42px;border-radius:9px;flex-shrink:0;overflow:hidden;position:relative}
@media (max-width:860px){
  .fab{bottom:calc(84px + env(safe-area-inset-bottom));right:16px}
  .status{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .stat{padding:9px 10px}
  .mission .goal-line{font-size:19px}
  .app{flex-direction:column}
  nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10;gap:0}
  .brand,.nav-label,.side-foot{display:none}
  .nav-btn{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 6px;flex:1;text-align:center;justify-content:center}
  main{padding:14px 14px 100px}
  .grid,.two{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .hero{height:160px}
  .hero-txt h1{font-size:25px}
  .week{grid-template-columns:minmax(90px,1.3fr) repeat(7,1fr) 44px;font-size:12.5px}
  .hrow{grid-template-columns:110px 1fr 56px}
  .task{grid-template-columns:auto 1fr}
  .task select{grid-column:2}
  .quote p{font-size:17px}
}

/* Hero mit Spruch */
.hero{height:230px}
.hero-txt{display:flex;gap:16px;align-items:flex-end}
.hero-ico{display:none}
.hq{font-family:Newsreader,serif;font-style:italic;font-size:16px;line-height:1.45;margin:8px 0 0;opacity:.95;max-width:640px}
.hq span{font-family:Inter;font-style:normal;font-size:12px;opacity:.8}
.commit{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.commit .signed{font-family:Newsreader,serif;font-style:italic;font-size:15px}
.commit .promise{font-size:13.5px;color:var(--muted);flex:1;min-width:200px;line-height:1.45}

/* ===== Design: Verbindlich ===== */
body.t-verbindlich[class]{--bg:#f3f0e8;--panel:#fffdf8;--ink:#1c2230;--muted:#6f6a60;--line:#dcd5c6;--accent:#b08d3c;--accent-soft:#f5ecd6;--ok:#2f6b4a;--slip:#9c8562;--side:#1c2230;--r:6px}
body.t-verbindlich .card,body.t-verbindlich .kpi{border-radius:6px;box-shadow:none}
body.t-verbindlich .btn{border-radius:4px;letter-spacing:.01em}
body.t-verbindlich .pill{border-radius:4px}
body.t-verbindlich .nav-btn{border-radius:4px}
body.t-verbindlich .proud{background:var(--panel)}
body.t-verbindlich .tag{border-radius:3px;background:transparent;border:1px solid var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
body.t-verbindlich .card h3{font-size:18px}
body.t-verbindlich .hero{height:auto;background:transparent;box-shadow:none;border-radius:0;overflow:visible;padding:4px 0 20px;border-bottom:1px solid var(--line)}
body.t-verbindlich .hero>svg.scene{display:none}
body.t-verbindlich .hero-txt{position:static;color:var(--ink);text-shadow:none;align-items:center}
body.t-verbindlich .hero-ico{display:block;width:54px;height:54px;border-radius:50%;overflow:hidden;position:relative;flex-shrink:0;border:2px solid var(--accent)}
body.t-verbindlich .hero-ico svg{position:absolute;inset:0;width:100%;height:100%}
body.t-verbindlich .hero-txt .date{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--muted)}
body.t-verbindlich .hq{color:var(--ink)}
body.t-verbindlich .hq span{color:var(--muted)}
body.t-verbindlich .mission{background:var(--ink);color:#f3f0e8;border:none;border-radius:6px;box-shadow:none;border-left:5px solid var(--accent)}
body.t-verbindlich .mission .why,body.t-verbindlich .mission .stat small,body.t-verbindlich .commit .promise{color:#b9b3a8}
body.t-verbindlich .mission .stat{background:rgba(255,255,255,.06);border-radius:4px}
body.t-verbindlich .mission .verdict{background:rgba(255,255,255,.08);color:#fff;border-radius:4px}
body.t-verbindlich .mission .verdict.good{background:rgba(47,107,74,.45)}
body.t-verbindlich .mission .verdict.alert{background:rgba(176,141,60,.28)}
body.t-verbindlich .pill.slip,body.t-verbindlich .tri.no{background:#ece6da;border-color:#b9a98d;color:#5f5038}
body.t-verbindlich .slip-msg{background:#efe9dc;color:#4f4433}
body.t-verbindlich .x:hover{color:var(--ink)}
body.t-verbindlich .countdown{border-radius:3px;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
body.t-verbindlich .mission .label{display:block}
.mission .label{display:none;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#b9b3a8;margin-bottom:8px}
body.t-verbindlich .now-label{color:var(--accent)}
/* Der rote Faden */
body.t-verbindlich .thread{grid-template-columns:1fr;position:relative;padding-left:32px}
body.t-verbindlich .thread::before{content:"";position:absolute;left:10px;top:28px;bottom:24px;width:2px;background:var(--accent)}
body.t-verbindlich .thread>.card{position:relative}
body.t-verbindlich .thread>.card::before{content:"";position:absolute;left:-29px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
body.t-verbindlich details.more summary{border-radius:4px}
@media (max-width:860px){.hero{height:210px}.hq{font-size:14px}body.t-verbindlich .hero{height:auto}body.t-verbindlich .thread{padding-left:24px}body.t-verbindlich .thread::before{left:6px}body.t-verbindlich .thread>.card::before{left:-23px}}

/* Tagesabschnitte */
.day-sec{margin-bottom:14px}
.sec-head{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.sec-head .t{font-family:Newsreader,serif;font-size:18px;font-weight:600}
.sec-head .sum{color:var(--muted);font-size:13px;flex:1;text-align:right}
.sec-head .chev{color:var(--muted);transition:.2s}
.day-sec.open .sec-head{border-color:transparent;background:transparent;padding-left:0}
.day-sec.open .chev{transform:rotate(180deg)}
.day-sec.done .sum{color:var(--ok);font-weight:600}
.sec-body{margin-top:6px}
/* Bearbeiten-Button */
.edit-btn{all:unset;cursor:pointer;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap}
.edit-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
body.t-verbindlich .edit-btn{border-radius:4px}
/* Idealer Tag – Ansicht */
.manifest{font-family:Newsreader,serif;font-style:italic;font-size:19px;line-height:1.5;padding:4px 0 22px;color:var(--ink);max-width:760px}
.timeline{position:relative;padding-left:0}
.tl-row{display:grid;grid-template-columns:118px 28px 1fr;align-items:start;min-height:64px}
.tl-time{font-family:Newsreader,serif;font-size:20px;font-weight:600;padding-top:2px;text-align:right;padding-right:6px}
.tl-time small{display:block;font-family:Inter;font-size:12px;font-weight:400;color:var(--muted)}
.tl-rail{position:relative;height:100%}
.tl-rail::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--accent);opacity:.55}
.tl-row:first-child .tl-rail::before{top:12px}
.tl-row:last-child .tl-rail::before{bottom:calc(100% - 12px)}
.tl-rail i{position:absolute;left:7px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tl-row.now .tl-rail i{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tl-title{font-size:16.5px;padding:3px 0 18px 8px}
.tl-row.now .tl-title{font-weight:600}
.tl-row.past .tl-title,.tl-row.past .tl-time{opacity:.5}
@media (max-width:860px){.tl-row{grid-template-columns:82px 26px 1fr}.tl-time{font-size:17px}.manifest{font-size:17px}}

.vision{margin-top:2px}
.vision span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.vision ul{margin:6px 0 0;padding-left:18px;font-size:15px;line-height:1.55}
.tbar{height:5px;background:rgba(127,127,127,.25);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.tbar i{display:block;height:100%;background:var(--accent)}
.mission .tstat{font-size:13px;opacity:.75}
.woop{font-size:13.5px;line-height:1.5;padding:10px 12px;border-radius:8px;background:rgba(127,127,127,.1);display:flex;flex-direction:column;gap:4px}
.woop-edit{padding:12px;border:1px dashed var(--line);border-radius:8px}
.months{display:flex;flex-wrap:wrap;gap:6px}
.mcell{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;opacity:.9}
.mcell input{width:74px!important;padding:6px!important;text-align:center;font-size:13px!important}
.mcell.met input{border-color:var(--ok)!important;box-shadow:inset 0 0 0 1px var(--ok)}
.mcell.miss input{border-color:#b9a98d!important}
/* Zeitstrahl Ziele */
.gt{overflow-x:auto}
.gt-head,.gt-row{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center;min-width:620px}
.gt-months{display:flex}
.gt-months span{flex:1;font-size:11.5px;color:var(--muted);border-left:1px solid var(--line);padding-left:5px}
.gt-row{padding:10px 0;border-top:1px solid var(--line)}
.gt-label{font-size:13.5px;line-height:1.3}
.gt-label small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.gt-track{position:relative;height:26px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/6 - 1px),var(--line) calc(100%/6 - 1px),var(--line) calc(100%/6))}
.gt-bar{position:absolute;top:5px;height:16px;border-radius:4px;border:1.5px solid var(--ink);display:flex;gap:2px;padding:2px;overflow:hidden;background:var(--panel)}
.gt-row.master .gt-bar{border-color:var(--accent);height:20px;top:3px}
.gt-bar i{flex:1;border-radius:2px;background:transparent}
.gt-bar i.met,.gt-bar i.fill{background:var(--accent)}
.gt-bar i.miss{background:#d8cdb8}
.gt-bar i.open{background:rgba(127,127,127,.12)}
.gt-today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
.gt-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.gt-legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.gt-legend i.met{background:var(--accent)}.gt-legend i.miss{background:#d8cdb8}.gt-legend i.open{background:rgba(127,127,127,.15)}.gt-legend i.today{background:var(--ink);width:2px}
.grat-q{font-size:13.5px;color:var(--muted);margin:0 0 10px;font-style:italic}

.goal-view{display:flex;flex-direction:column;gap:14px}
.gtitle{font-family:Newsreader,serif;font-weight:600;line-height:1.3}
.gsec .gh{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;opacity:.6;margin-bottom:4px}
.gsec{font-size:14.5px;line-height:1.5}
.gsec ul{margin:2px 0 0;padding-left:18px}
.gsplit{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mission .gsec{padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.goal-view:not(.mission) .gsec{padding-top:12px;border-top:1px solid var(--line)}
.gsplit .gsec{border-top:1px solid rgba(127,127,127,.18)!important}
/* kompakter Zeitstrahl */
.gt-top{display:flex;justify-content:flex-end;margin-bottom:8px}
.tabs.small button{padding:4px 11px;font-size:12px}
.gt-inner{overflow-x:auto}
.gt-head,.gt-row{grid-template-columns:150px 1fr 40px!important;gap:10px!important;min-width:560px!important}
.gt-head{display:grid}
.gt-months span{font-size:10.5px!important;white-space:nowrap;overflow:visible}
.gt-row{padding:5px 0!important;border-top:none!important}
.gt-label{font-size:12.5px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-row.master .gt-label{font-weight:600}
.gt-pct{font-size:11.5px;color:var(--muted);text-align:right}
.gt-track{height:18px!important;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px)!important;background-repeat:repeat-x}
.gt-bar{top:4px!important;height:10px!important;padding:1px!important;gap:1px!important;border-width:1px!important}
.gt-row.master .gt-bar{height:12px!important;top:3px!important;border-width:1.5px!important}
.gt-legend{margin-top:8px!important;font-size:11px!important}
@media (max-width:860px){.gsplit{grid-template-columns:1fr}}

.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}
.auth .card{max-width:400px;width:100%;padding:28px}
.auth h1{font-size:28px;margin-bottom:6px}
.auth .gold{width:44px;height:3px;background:var(--accent);margin:14px 0 18px}
.auth input{margin-bottom:10px}
.auth .err{color:#8a3a30;font-size:13.5px;min-height:18px;margin:4px 0 8px}
.banner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);font-size:13px;padding:9px 13px;border-radius:6px;margin-bottom:14px}

.savepill{position:fixed;top:14px;right:16px;z-index:25;font-size:12.5px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);box-shadow:0 4px 14px -8px rgba(0,0,0,.3);display:flex;align-items:center;gap:6px;pointer-events:none}
.savepill i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.savepill.saving i{background:var(--accent);animation:pulse 1s infinite}
.savepill.error{color:#8a3a30;border-color:#e2928a}.savepill.error i{background:#c0392b}
.savepill.local i{background:#9a958c}
.logout-side{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent);color:#fff;font-size:14.5px;font-weight:500;transition:.15s}
body.t-verbindlich .logout-side{border-radius:4px}
.logout-side:hover{filter:brightness(1.1)}
.logout-mobile{display:none}
@media (max-width:860px){.logout-mobile{all:unset;display:flex;align-items:center;gap:6px;position:fixed;top:10px;left:10px;z-index:25;background:var(--accent);color:#fff;font-size:12px;font-weight:500;padding:6px 11px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px -8px rgba(0,0,0,.4)}body.t-verbindlich .logout-mobile{border-radius:4px}}
@media (max-width:860px){.savepill{top:10px;right:10px;font-size:11.5px;padding:5px 9px}}

.tour-hole{position:fixed;z-index:60;border-radius:10px;box-shadow:0 0 0 9999px rgba(15,18,25,.62);transition:all .25s;pointer-events:none;outline:2px solid var(--accent)}
.tour-card{position:fixed;z-index:61;left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 28px));background:var(--panel);color:var(--ink);border-radius:12px;padding:18px 20px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);border-top:4px solid var(--accent)}
.tour-card h3{font-size:19px;margin:2px 0 8px}
.tour-card p{font-size:14.5px;line-height:1.55;margin:0 0 14px}
.tour-step{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tour-btns{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sec-head.static{cursor:default}
.day-sec.plan .sec-head{border-color:transparent;background:transparent;padding-left:0}

/* ===== Startseite ===== */
.auth.lp-host{display:block!important;padding:0;min-height:100vh;background:#f3f0e8;overflow-x:hidden}
.lp{width:100%}
.lp{--ink:#1c2230;--gold:#b08d3c;--paper:#f3f0e8;--muted:#6f6a60;color:var(--ink);font-family:Inter,system-ui,sans-serif}
.lp-wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.lp h1,.lp h2,.lp h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0}
.lp-nav{position:sticky;top:0;z-index:5;background:rgba(243,240,232,.9);backdrop-filter:blur(8px);border-bottom:1px solid #e3dccd}
.lp-nav .lp-wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.lp-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:Newsreader,serif;font-weight:600;font-size:19px}
.lp-logo svg,.lp-foot svg{width:30px;height:30px;vertical-align:middle}
.lp-nav nav{display:flex;align-items:center;gap:22px}
.lp-link{color:var(--ink);text-decoration:none;font-size:14.5px;opacity:.8}
.lp-link:hover{opacity:1}
.lp-btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--gold);color:#fff;font-weight:600;font-size:15px;padding:12px 22px;border-radius:6px;text-align:center;transition:.15s}
.lp-btn:hover{filter:brightness(1.07)}
.lp-btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.lp-btn.full{display:block;width:100%}
.lp-hero{padding:64px 0 0;background:linear-gradient(180deg,#f3f0e8 0%,#efe9dd 100%)}
.lp-hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.lp-kicker{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:14px}
.lp-hero h1{font-size:58px;line-height:1.05;letter-spacing:-.01em}
.lp-sub{font-size:18px;line-height:1.6;color:#3b3f4a;max-width:560px;margin:20px 0 0}
.lp-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.lp-trust{margin-top:18px;font-size:13.5px;color:var(--muted)}
.lp-auth{background:#fffdf8;border:1px solid #e3dccd;border-radius:10px;padding:24px;box-shadow:0 30px 60px -40px rgba(28,34,48,.5)}
.lp-auth input{width:100%;font:inherit;font-size:15px;border:1px solid #dcd5c6;background:#fff;border-radius:6px;padding:12px 13px;margin-bottom:10px;color:var(--ink);outline:none;box-sizing:border-box}
.lp-auth input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f5ecd6}
.lp-auth .err{color:#8a3a30;font-size:13.5px;min-height:18px;margin:2px 0 8px}
.lp-tabs{display:flex;gap:4px;background:#f3f0e8;padding:4px;border-radius:8px;margin-bottom:16px}
.lp-tabs button{all:unset;flex:1;text-align:center;cursor:pointer;padding:8px;border-radius:6px;font-size:14px;color:var(--muted)}
.lp-tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lp-fine{font-size:12.5px;color:var(--muted);line-height:1.5;margin:14px 0 0}
.lp-shot{margin-top:56px;display:flex;justify-content:center}
/* Mockups */
.mock{width:100%;max-width:860px;background:#fffdf8;border-radius:12px 12px 0 0;box-shadow:0 40px 80px -40px rgba(28,34,48,.55);border:1px solid #e3dccd;border-bottom:none;overflow:hidden;text-align:left}
.mock.small{max-width:480px;border-radius:12px;border-bottom:1px solid #e3dccd}
.mock-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#ece6da;font-size:12px;color:var(--muted)}
.mock-bar i{width:9px;height:9px;border-radius:50%;background:#d6cdbb}
.mock-bar span{margin-left:10px}
.mock-body{padding:22px 26px 26px;background:#f3f0e8}
.m-date{font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.m-h{font-family:Newsreader,serif;font-size:26px;font-weight:600;margin:4px 0}
.m-q{font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#3b3f4a;margin-bottom:16px}
.m-mission{background:#1c2230;color:#f3f0e8;border-left:5px solid var(--gold);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.m-mission small{display:block;font-size:10px;letter-spacing:.12em;opacity:.65}
.m-mission b{display:block;font-family:Newsreader,serif;font-size:19px;margin:4px 0 8px}
.m-mission span{font-size:12px;opacity:.75}
.m-mission ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
.m-tb{height:4px;background:rgba(255,255,255,.18);border-radius:4px;margin-bottom:6px}.m-tb i{display:block;height:100%;background:var(--gold);border-radius:4px}
.m-sec{font-family:Newsreader,serif;font-size:16px;font-weight:600;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.m-sec span{font-family:Inter;font-size:11.5px;color:var(--muted);font-weight:400}
.m-card{background:#fffdf8;border:1px solid #dcd5c6;border-radius:6px;padding:14px 16px;margin-bottom:10px;font-size:13px}
.m-card b{display:block;font-family:Newsreader,serif;font-size:14.5px;margin-bottom:8px}
.m-task{display:flex;align-items:center;gap:9px;padding:4px 0}
.m-task i{width:15px;height:15px;border:2px solid #dcd5c6;border-radius:4px}
.m-task.done i{background:#2f6b4a;border-color:#2f6b4a}
.m-task.done{color:var(--muted);text-decoration:line-through}
.m-pills{display:flex;flex-wrap:wrap;gap:6px}
.m-pills span{border:1.5px solid #dcd5c6;border-radius:4px;padding:5px 9px;font-size:12px;background:#fff}
.m-pills span.ok{background:#2f6b4a;border-color:#2f6b4a;color:#fff}
.m-gt-h,.m-gt{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:12px}
.m-gt-h{grid-template-columns:110px repeat(6,1fr);color:var(--muted);font-size:10.5px;margin-bottom:6px}
.m-gt{padding:7px 0}
.m-gt>div{position:relative;height:16px;background-image:linear-gradient(90deg,#dcd5c6 1px,transparent 1px);background-size:16.66% 100%}
.m-gt .bar{position:absolute;top:3px;height:10px;border:1.5px solid var(--gold);border-radius:3px;display:flex;gap:1px;padding:1px;background:#fffdf8;box-sizing:border-box}
.m-gt .bar em{flex:1;border-radius:2px;background:rgba(0,0,0,.06)}
.m-gt .bar em.met,.m-gt .bar em.fill{background:var(--gold)}
.m-gt u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.m-av{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fffdf8;border:1px solid #dcd5c6;border-radius:6px;padding:12px 14px;margin-bottom:10px;font-size:13px}
.m-av span{background:#2f6b4a;color:#fff;border-radius:4px;padding:6px 9px}
.m-av em{font-style:normal;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.45}
.m-av em b{color:#2f6b4a}
.m-note{font-family:Newsreader,serif;font-style:italic;font-size:13.5px;color:#3b3f4a;margin-top:4px}
.m-chart{display:flex;align-items:flex-end;gap:8px;height:110px;margin-bottom:14px}
.m-chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.m-chart i{width:100%;background:var(--gold);border-radius:3px 3px 1px 1px}
.m-chart span{font-size:10px;color:var(--muted)}
.m-ai{background:#fffdf8;border:1px solid #dcd5c6;border-radius:6px;padding:12px 14px;font-size:13px}
.m-ai small{font-size:10px;letter-spacing:.12em;color:var(--gold);font-weight:600}
.m-ai b{display:block;font-family:Newsreader,serif;margin:4px 0}
.m-ai p{margin:0;line-height:1.5;color:#3b3f4a}
/* Sektionen */
.lp-three{background:#1c2230;color:#f3f0e8;padding:64px 0}
.lp-three .lp-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
.lp-three span{font-size:28px}
.lp-three h3{font-size:21px;margin:12px 0 8px}
.lp-three p{font-size:15px;line-height:1.6;opacity:.8;margin:0}
.lp-feature{padding:88px 0}
.lp-feature.alt{background:#efe9dd}
.lp-row{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.lp-row.rev .lp-txt{order:2}
.lp-txt h2{font-size:36px;line-height:1.15;margin-bottom:16px}
.lp-txt p{font-size:16.5px;line-height:1.65;color:#3b3f4a;margin:0}
.lp-privacy{padding:72px 0;background:#fffdf8;border-top:1px solid #e3dccd;border-bottom:1px solid #e3dccd;text-align:center}

.lp-pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:32px;text-align:left}

.lp-pgrid p{font-size:14.5px;line-height:1.6;color:#3b3f4a;margin:6px 0 0}
.lp-price{padding:88px 0;text-align:center}
.lp-price h2{font-size:38px}
.lp-plans{display:grid;grid-template-columns:repeat(2,minmax(0,360px));gap:24px;justify-content:center;margin-top:40px;text-align:left}
.plan{position:relative;background:#fffdf8;border:1px solid #dcd5c6;border-radius:10px;padding:28px}
.plan.pro{border:2px solid var(--gold);box-shadow:0 30px 60px -40px rgba(176,141,60,.7)}
.plan .badge{position:absolute;top:-12px;right:20px;background:var(--gold);color:#fff;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:4px}
.plan h3{font-size:22px}
.plan .price{font-family:Newsreader,serif;font-size:40px;font-weight:600;margin-top:10px}
.plan .per{font-size:13px;color:var(--muted)}
.plan ul{list-style:none;padding:0;margin:20px 0 24px;font-size:14.5px;line-height:1.5}
.plan li{padding:6px 0 6px 24px;position:relative}
.plan li::before{content:"✓";position:absolute;left:0;color:var(--gold);font-weight:700}
.lp-end{background:#1c2230;color:#f3f0e8;text-align:center;padding:72px 0}
.lp-end h2{font-size:38px;margin-bottom:24px}
.lp-foot{padding:24px 0;font-size:13px;color:var(--muted)}
.lp-foot .lp-wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:900px){
  .lp-hero{padding-top:36px}
  .lp-hero-grid,.lp-row,.lp-three .lp-wrap,.lp-pgrid{grid-template-columns:1fr;gap:32px}
  .lp-row.rev .lp-txt{order:0}
  .lp-hero h1{font-size:40px}
  .lp-sub{font-size:16.5px}
  .lp-link{display:none}
  .lp-feature,.lp-price{padding:56px 0}
  .lp-txt h2,.lp-price h2,.lp-end h2{font-size:28px}
  .lp-plans{grid-template-columns:1fr}
  .mock-body{padding:16px}
  .m-gt-h,.m-gt{grid-template-columns:86px 1fr}.m-gt-h{grid-template-columns:86px repeat(6,1fr)}
}

.fold{margin-bottom:14px}
.fold-head{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.fold-head .t{font-family:Newsreader,serif;font-size:19px;font-weight:600;white-space:nowrap}
.fold-head .t small{font-family:Inter;font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.fold-head .sum{flex:1;text-align:right;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.brand b{letter-spacing:.01em}

<div class="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>

<script>
/* =========================================================
   Daten & Speicherung (Cloud über claude-db, Fallback lokal)
   ========================================================= */
const LKEY='erfolgsjournal_v1';
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>iso(new Date());
const addDays=(ds,n)=>{const d=new Date(ds+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const uid=()=>Math.random().toString(36).slice(2,9);
const DISTR_SEED=[['alk','🍺 Alkohol'],['shorts','📱 Shorts / Social Media'],['suess','🍫 Süßes / Snacks'],['spaet','🌙 Zu spät ins Bett'],['prok','⏳ Aufgeschoben'],['couch','🛋️ Keine Bewegung']];

function addMonths(ds,n){const d=new Date(ds+'T12:00');d.setMonth(d.getMonth()+n);return iso(d)}
function firstOfNextMonth(){const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth()+1,1))}
function seedGoals(){const st=firstOfNextMonth();return[
    {id:'d1',master:true,title:'Nebeneinkommen aufbauen',metric:'Einnahmen',target:500,unit:'€',rhythm:'monat',start:st,deadline:(()=>{const d=new Date(addMonths(st,6)+'T12:00');d.setDate(d.getDate()-1);return iso(d)})(),months:{},progress:0,
     why:'Mehr finanzielle Freiheit und ein Projekt, das mir gehört',
     vision:'Ich habe ein finanzielles Polster und weniger Druck\nIch arbeite an etwas, das mich begeistert\nIch entscheide selbst, wie es beruflich weitergeht',
     obstacle:'Abends bin ich müde und lande auf der Couch',plan:'Wenn ich nach Hause komme, arbeite ich zuerst 30 Minuten an meinem Projekt – danach ist Feierabend.'},
    {id:'d2',title:'10 km unter 60 Minuten laufen',metric:'',target:'',unit:'',rhythm:'gesamt',start:today(),deadline:addMonths(today(),4),progress:10,why:'Fit und energiegeladen sein'},
    {id:'d3',title:'12 Bücher in diesem Jahr lesen',metric:'Gelesene Bücher',target:12,unit:'Bücher',rhythm:'gesamt',current:0,start:today(),deadline:new Date().getFullYear()+'-12-31',progress:0,why:'Jeden Monat etwas Neues lernen'}
  ]}
function seedIdeal(){return[
    {id:'i1',time:'06:30',end:'',title:'Aufstehen, Wasser trinken'},
    {id:'i2',time:'07:00',end:'07:30',title:'Bewegung'},
    {id:'i3',time:'08:00',end:'12:00',title:'Fokuszeit – das Wichtigste zuerst'},
    {id:'i4',time:'12:30',end:'13:00',title:'Mittag und kurzer Spaziergang'},
    {id:'i5',time:'18:00',end:'20:00',title:'Zeit mit Familie und Freunden'},
    {id:'i6',time:'21:30',end:'',title:'Handy weg, Tag reflektieren'},
    {id:'i7',time:'22:30',end:'',title:'Schlafen'}
  ]}
function seed(){return{
  name:'',
  settings:{v:4,layout:'verbindlich',evening:17,tutorialDone:false},
  goals:seedGoals(),
  idealDay:seedIdeal(),idealWhy:'Ich starte ausgeruht in den Tag, arbeite konzentriert an dem, was mir wichtig ist, und habe abends Zeit für die Menschen, die ich liebe.',
  habits:[
    {id:'h1',name:'30 Min. Bewegung',icon:'🏃',type:'do',target:4},
    {id:'h2',name:'2 Liter Wasser',icon:'💧',type:'do',target:7},
    {id:'h3',name:'10 Min. lesen',icon:'📖',type:'do',target:5},
    {id:'h4',name:'Vor 23 Uhr schlafen',icon:'😴',type:'do',target:5},
    {id:'h5',name:'Kein Social Media nach 21 Uhr',icon:'📵',type:'avoid',cost:45,unit:'Min.'},
    {id:'h6',name:'Keine Süßgetränke',icon:'🥤',type:'avoid',cost:2,unit:'€'},
    {id:'h7',name:'Kein Fast Food',icon:'🍔',type:'avoid',cost:9,unit:'€'}
  ],
  values:[],
  days:{}
}}
const dl=()=>S.distractions;
const DAY_DEFAULT=()=>({committed:'',goal:'',grat:['','',''],tasks:[{t:'',done:false,goal:''},{t:'',done:false,goal:''}],habits:{},good:'',learn:'',mood:0,win:'',bed:'',phoneOff:'',distr:[],distrNote:''});
function normalize(s){
  s.goals=s.goals||[];s.values=s.values||[];s.habits=s.habits||[];s.days=s.days||{};
  s.distractions=s.distractions||DISTR_SEED.map(x=>[...x]);
  s.settings=Object.assign({layout:'verbindlich',evening:17},s.settings||{});
  if((s.settings.v||0)<2){s.settings.layout='verbindlich'}
  if((s.settings.v||0)<3){
    // Beispielziele (unverändert) auf Masterziel-Struktur umstellen
    if(s.goals.length===2&&s.goals[0].id==='g1'&&s.goals[1].id==='g2'&&s.goals[1].title==='5 kg abnehmen')s.goals=seedGoals();
    if(s.settings.main&&s.goals.find(g=>g.id===s.settings.main))s.goals.forEach(g=>g.master=g.id===s.settings.main);
    if(!s.idealDay)s.idealDay=seedIdeal();
  }
  if((s.settings.v||0)<4){
    const g0=s.goals.find(g=>g.id==='g0'&&g.title==='Trading zu meiner Lebensgrundlage machen');
    if(g0)Object.assign(g0,{title:'Trading: konstant monatlich auszahlen',metric:'Auszahlung (17 Konten)',target:2000,unit:'$',rhythm:'monat',start:'2026-12-01',deadline:'2027-05-31',months:{},
      vision:'Ich bestimme selbst über meine Zeit und meinen Tag\nMein Einkommen hängt von meiner Kompetenz ab – nicht von einzelnen Abschlüssen\nIch lebe meinen idealen Tag, nicht nur am Wochenende',
      obstacle:'Abends Bier und Shorts – am nächsten Morgen unkonzentriert in der Session',plan:'Wenn ich abends Lust auf Bier habe, trinke ich Alkoholfreies und lege das Handy um 22 Uhr in die Küche.'});
    s.goals.forEach(g=>{if(g.id==='g1'&&!g.start)g.start='2026-11-01';if(g.id==='g3'&&!g.start){g.start='2026-12-01';g.deadline=g.deadline||'2027-05-31'}});
  }
  s.settings.v=4;
  if(s.goals.length&&!s.goals.some(g=>g.master))s.goals[0].master=true;
  s.idealDay=s.idealDay||seedIdeal();s.idealWhy=s.idealWhy||'';
  s.habits.forEach(h=>{h.type=h.type||'do';if(h.type==='do'&&!h.target)h.target=7;if(h.type==='avoid'){if(h.cost==null)h.cost=0;h.unit=h.unit||'€'}});
  Object.keys(s.days).forEach(k=>{s.days[k]=Object.assign(DAY_DEFAULT(),s.days[k]);s.days[k].tasks.forEach(t=>{if(t.goal==null)t.goal=''})});
  return s;
}
let S;
try{S=JSON.parse(localStorage.getItem(LKEY))}catch(e){}
S=normalize(S||seed());
function day(d=today()){if(!S.days[d])S.days[d]=DAY_DEFAULT();return S.days[d]}
const metaObj=()=>({distractions:S.distractions,idealDay:S.idealDay,idealWhy:S.idealWhy,name:S.name,goals:S.goals,habits:S.habits,values:S.values,settings:S.settings});

/* --- Verschlüsselung: Daten werden im Browser mit dem Passwort verschlüsselt --- */
const TE=new TextEncoder(),TD=new TextDecoder();
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let CK=null;
async function deriveKey(pw,uid){const base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:TE.encode('erfolgsjournal:'+uid),iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encObj(o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},CK,TE.encode(JSON.stringify(o)));return{enc:1,iv:b64(iv),ct:b64(ct)}}
async function decObj(d){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(d.iv)},CK,unb64(d.ct));return JSON.parse(TD.decode(pt))}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ej',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function keyGet(uid){try{const db=await idb();return await new Promise(res=>{const t=db.transaction('k').objectStore('k').get(uid);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)})}catch(e){return null}}
async function keyPut(uid,k){try{const db=await idb();await new Promise(res=>{const t=db.transaction('k','readwrite');t.objectStore('k').put(k,uid);t.oncomplete=res;t.onerror=res})}catch(e){}}
async function keyClear(){try{const db=await idb();await new Promise(res=>{const t=db.transaction('k','readwrite');t.objectStore('k').clear();t.oncomplete=res;t.onerror=res})}catch(e){}}
async function doLogout(){try{await SB.auth.signOut()}catch(e){}await keyClear();try{localStorage.removeItem(LKEY);localStorage.removeItem('ej_uid')}catch(e){}location.reload()}

/* --- Cloud (Supabase) --- */
const CFG=window.EJ_CONFIG||{};
const CONFIGURED=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&!/DEIN|XXX/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY));
const SB=CONFIGURED&&window.supabase?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
let UID=null, cloud=false, dictation=null;
const dirty=new Set(), pend={}, inflight={};
let saveT,saveSt={st:'ok',t:''};
function setSave(st){if(st==='ok'){const n=new Date();saveSt={st,t:String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}}else saveSt={st,t:saveSt.t};renderSave()}
function renderLogoutMobile(){let b=document.getElementById('logoutMobile');if(!(SB&&cloud)){if(b)b.remove();return}if(!b){b=document.createElement('button');b.id='logoutMobile';b.className='logout-mobile';b.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Abmelden';b.onclick=doLogout;document.body.appendChild(b)}}
function renderSave(){renderLogoutMobile();let el=document.getElementById('savepill');if(!el){el=document.createElement('div');el.id='savepill';document.body.appendChild(el)}
  const st=!cloud?'local':saveSt.st;el.className='savepill '+st;
  el.innerHTML='<i></i>'+(st==='local'?(CONFIGURED?'Nicht verbunden – nur auf diesem Gerät':'Testmodus – nur auf diesem Gerät'):st==='saving'?'Speichert …':st==='error'?'⚠ Nicht gespeichert – wird erneut versucht':'✓ Gespeichert'+(saveSt.t?' · '+saveSt.t:''))}
function markDay(d=today()){dirty.add('d-'+d);schedule()}
function markMeta(){dirty.add('meta');schedule()}
function schedule(){
  try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}
  if(cloud)setSave('saving');
  clearTimeout(saveT);saveT=setTimeout(()=>{dirty.forEach(k=>queue(k));dirty.clear();if(!cloud)renderSave()},600);
}
function queue(k){if(!cloud)return;pend[k]=JSON.parse(JSON.stringify(k==='meta'?metaObj():S.days[k.slice(2)]||{}));flush(k)}
async function flush(k){
  if(inflight[k]||!(k in pend))return;
  const data=pend[k];delete pend[k];inflight[k]=true;
  let error=null;
  try{const payload=await encObj(data);({error}=await SB.from('journal').upsert({user_id:UID,key:k,data:payload,updated_at:new Date().toISOString()}))}catch(e){error=e}
  if(error){console.warn('db',error);if(!(k in pend))pend[k]=data;setSave('error');setTimeout(()=>flush(k),5000+Math.random()*3000)}
  inflight[k]=false;if(k in pend&&!error)flush(k);
  if(!error&&!Object.keys(pend).length&&!Object.values(inflight).some(Boolean)&&!dirty.size)setSave('ok');
}
async function loadAll(){
  let rows=[],from=0;
  while(true){const {data,error}=await SB.from('journal').select('key,data').range(from,from+999);if(error)throw error;rows=rows.concat(data);if(data.length<1000)break;from+=1000}
  return rows;
}
async function initCloud(){
  dictation=makeDictation();
  if(!SB){if(!S.settings.tutorialDone)setTimeout(startTour,400);return}
  try{
    const {data:{session}}=await SB.auth.getSession();
    if(!session){showLogin();return}
    UID=session.user.id;
    CK=await keyGet(UID);
    if(!CK){showUnlock(session.user.email);return}
    let cachedFor='';try{cachedFor=localStorage.getItem('ej_uid')||''}catch(e){}
    if(cachedFor!==UID)S=normalize(seed());
    try{localStorage.setItem('ej_uid',UID)}catch(e){}
    const rows=await loadAll();
    if(!rows.length){
      // Neues Konto: neutrale Beispiele + Tutorial
      S=normalize(seed());cloud=true;queue('meta');
      setSync();render();setSave('ok');setTimeout(startTour,400);return;
    }
    const n={name:'',goals:[],habits:[],values:[],days:{}},plain=[];
    for(const r of rows){
      let v=r.data;
      if(v&&v.enc){try{v=await decObj(v)}catch(e){await keyClear();CK=null;showUnlock(session.user.email,'Das Passwort passt nicht zu deinen Daten.');return}}
      else plain.push(r.key);
      if(r.key==='meta')Object.assign(n,v);else if(r.key.startsWith('d-'))n.days[r.key.slice(2)]=v;
    }
    if(n.settings&&n.settings.tutorialDone===undefined)n.settings.tutorialDone=true; // bestehende Konten: keine Auto-Tour
    S=normalize(n);cloud=true;
    try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}
    plain.forEach(k=>queue(k)); // alte, unverschlüsselte Einträge jetzt verschlüsselt speichern
    setSync();render();setSave('ok');
    if(!S.settings.tutorialDone)setTimeout(startTour,400);
  }catch(e){console.warn('cloud init',e);toast('Keine Verbindung – du arbeitest mit dem letzten Stand auf diesem Gerät.',4000);renderSave();setSync()}
}
function showUnlock(email,msg){
  document.querySelector('.app').style.display='none';
  ['savepill','fab','logoutMobile'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none'});
  let el=document.getElementById('auth');if(!el){el=document.createElement('div');el.id='auth';el.className='auth';document.body.appendChild(el)}
  el.innerHTML=`<div class="card"><h1>Entsperren</h1><div class="meta">Deine Einträge sind mit deinem Passwort verschlüsselt. Gib es einmal ein, um sie auf diesem Gerät zu öffnen.</div><div class="gold"></div>
    <input type="email" value="${esc(email)}" disabled>
    <input type="password" id="uP" placeholder="Passwort" autocomplete="current-password">
    <div class="err" id="uErr">${msg?esc(msg):''}</div>
    <div class="row"><button class="btn" id="uGo">Entsperren</button><button class="btn ghost" id="uOut">Abmelden</button></div></div>`;
  const go=async()=>{const pw=el.querySelector('#uP').value,err=el.querySelector('#uErr');err.textContent='';
    const r=await SB.auth.signInWithPassword({email,password:pw});if(r.error){err.textContent='Passwort falsch.';return}
    CK=await deriveKey(pw,r.data.user.id);await keyPut(r.data.user.id,CK);el.remove();document.querySelector('.app').style.display='';initCloud()};
  el.querySelector('#uGo').onclick=go;el.querySelector('#uP').onkeydown=e=>{if(e.key==='Enter')go()};el.querySelector('#uOut').onclick=doLogout;
}
/* =========================================================
   Startseite (Landing) mit Login
   ========================================================= */
const LP_SUN='<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1c2230"/><path d="M14 40a18 18 0 0 1 36 0z" fill="#b08d3c"/><rect x="10" y="42" width="44" height="3" rx="1.5" fill="#f3f0e8"/><g stroke="#b08d3c" stroke-width="3" stroke-linecap="round"><path d="M32 12v5M15 20l3.5 3.5M49 20l-3.5 3.5M8 33h4M52 33h4"/></g></svg>';

    <div class="mock-bar"><i></i><i></i><i></i><span>Mein Tag</span></div>
    <div class="mock-body">
      <div class="m-date">DONNERSTAG, 19. NOVEMBER</div>

        <small style="margin-top:10px">DAS GEWINNE ICH, WENN ICH DRANBLEIBE</small><ul><li>Ein finanzielles Polster und weniger Druck</li><li>Ein Projekt, das mich begeistert</li></ul></div>

    <div class="m-gt"><span>12 Bücher</span><div><i class="bar" style="left:0;width:100%;border-color:#1c2230"><em class="fill" style="flex:none;width:25%"></em></i><u style="left:24%"></u></div></div>
  </div></div>`}

    <div class="m-chart">${[40,65,55,80,70,90,75].map((h,i)=>`<div><i style="height:${h}%"></i><span>${['Mo','Di','Mi','Do','Fr','Sa','So'][i]}</span></div>`).join('')}</div>
    <div class="m-ai"><small>✨ KI-RÜCKBLICK</small><b>Muster, die mir auffallen</b><p>An Tagen, an denen du nach 21 Uhr am Handy warst, hast du am nächsten Morgen seltener deine 2 Aufgaben erledigt.</p></div>
  </div></div>`}
function landingHTML(){return `
<div class="lp">
  <header class="lp-nav"><div class="lp-wrap">
    <a class="lp-logo" href="#" onclick="return false">${LP_SUN}<span>Erfolgsjournal</span></a>
    <nav><a href="#lp-features" class="lp-link">Funktionen</a><a href="#lp-price" class="lp-link">Preise</a><button class="lp-btn ghost" data-go="login">Anmelden</button></nav>
  </div></header>

  <section class="lp-hero"><div class="lp-wrap lp-hero-grid">
    <div>
      <span class="lp-kicker">Das Journal für Menschen mit einem Ziel</span>
      <h1>Ein Ziel.<br>Jeden Tag ein Schritt.</h1>
      <p class="lp-sub">Das Erfolgsjournal hält dich auf Kurs: dein Masterziel immer im Blick, zwei Aufgaben pro Tag, die wirklich zählen – und ein ehrlicher Tagesabschluss gegen Handy, Couch und Ausreden.</p>
      <div class="lp-cta"><button class="lp-btn" data-go="signup">Kostenlos starten</button><button class="lp-btn ghost" data-go="login">Ich habe schon ein Konto</button></div>
      <div class="lp-trust">🔒 Ende-zu-Ende verschlüsselt · Server in Deutschland · Keine Werbung</div>
    </div>
    <div class="lp-auth card" id="lpAuth">
      <div class="lp-tabs"><button data-tab="signup" class="on">Konto erstellen</button><button data-tab="login">Anmelden</button></div>
      <input type="email" id="aE" placeholder="E-Mail" autocomplete="email">
      <input type="password" id="aP" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="new-password">
      <div class="err" id="aErr"></div>

function makeDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,cb={p:()=>{},f:()=>{},s:()=>{}};
  return{
    onPartial:f=>cb.p=f,onFinal:f=>cb.f=f,onState:f=>cb.s=f,
    start(){return new Promise((res,rej)=>{rec=new SR();rec.lang='de-DE';rec.interimResults=true;rec.continuous=true;
      rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)cb.f({text:r[0].transcript.trim()});else interim+=r[0].transcript}cb.p({text:interim})};
      rec.onerror=e=>{cb.s({state:'idle',reason:e.error});if(e.error==='not-allowed')rej({code:'not_granted'})};
      rec.onend=()=>cb.s({state:'idle',reason:'stopped'});
      rec.onstart=()=>{cb.s({state:'listening'});res()};
      try{rec.start()}catch(e){rej(e)}})},
    stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()}
  };
}

/* Verzicht: verzeihende Statistik statt harter Serie */
function avoidStats(h,n=30){
  const ds=lastN(n);let ok=0,slip=0;
  ds.forEach(d=>{const v=S.days[d]?.habits?.[h.id];if(v===true)ok++;else if(v===false)slip++});
  // Tage seit letztem Ausrutscher (nicht eingetragene Tage brechen nichts)
  let since=0,d=today(),guard=0;const first=Object.keys(S.days).filter(k=>S.days[k].habits?.[h.id]!==undefined).sort()[0];
  if(first){while(guard++<3650){const v=S.days[d]?.habits?.[h.id];if(v===false)break;if(d<first)break;if(v===true)since++;d=addDays(d,-1)}}
  return{ok,slip,n,since,saved:ok*(h.cost||0)};
}
function kept(ds){const x=S.days[ds];if(!x||!x.committed)return false;const t=x.tasks.filter(t=>t.t.trim());return t.length>0&&t.every(t=>t.done)&&!S.habits.some(h=>h.type==='avoid'&&x.habits?.[h.id]===false)}

    (r.slipped||[]).forEach(id=>{if(S.habits.find(h=>h.id===id))d.habits[id]=false});
    if((r.done||[]).length||(r.avoided||[]).length||(r.slipped||[]).length)applied.push('Gewohnheiten');
    (r.distractions||[]).forEach(k=>{if(dl().find(x=>x[0]===k)&&!d.distr.includes(k))d.distr.push(k)});
    if((r.distractions||[]).length)applied.push('Ablenkungen');
    if(r.distractionNote){d.distrNote=d.distrNote?d.distrNote+' '+r.distractionNote:r.distractionNote}
    if(r.win){d.win=r.win;applied.push('Erfolg')}
    if(r.good){d.good=d.good?d.good+'\n'+r.good:r.good;applied.push('Reflexion')}
    if(r.learn){d.learn=d.learn?d.learn+'\n'+r.learn:r.learn}
    if(r.mood>=1&&r.mood<=5)d.mood=Math.round(r.mood);
    if(/^\d{1,2}:\d{2}$/.test(r.bed||''))d.bed=r.bed.padStart(5,'0');
    if(/^\d{1,2}:\d{2}$/.test(r.phoneOff||''))d.phoneOff=r.phoneOff.padStart(5,'0');
    voiceText='';lastApplied=applied.length?'Eingetragen: '+applied.join(', ')+'. Schau kurz drüber – du kannst alles ändern.':'Ich konnte nichts Passendes finden. Sag z. B. „Mein Fokus heute …“';
    markDay();
    if(applied.length){sheetOpen=false;toast(lastApplied,4500);lastApplied=''}
  }catch(e){
    lastApplied='';
    toast(aiMsg(e),4000);
  }
  aiBusy=false;render();
}
function toggleDictation(){
  if(!dictation)return;
  if(recording){dictation.stop().catch(()=>{});return}
  dictAcc=voiceText?voiceText.trim()+' ':'';
  if(!dictWired){dictWired=true;
    dictation.onPartial(({text})=>{const ta=document.querySelector('#voice');if(ta)ta.value=dictAcc+text});
    dictation.onFinal(({text})=>{dictAcc+=text+' ';voiceText=dictAcc;const ta=document.querySelector('#voice');if(ta)ta.value=dictAcc});
    dictation.onState(({state})=>{recording=state==='listening';const b=document.querySelector('#mic');if(b){b.classList.toggle('rec',recording);b.innerHTML=recording?'⏹ Stopp':'🎙️ Einsprechen'}});
  }
  dictation.start().catch(e=>{recording=false;toast(e&&e.code==='not_granted'?'Mikrofon nicht erlaubt – du kannst auch tippen oder die Diktierfunktion deiner Tastatur nutzen.':'Mikrofon gerade nicht verfügbar.',4000)});
}

/* =========================================================
   Ziele
   ========================================================= */
function goalSteps(gid,n=30){return lastN(n).flatMap(d=>(S.days[d]?.tasks||[]).filter(t=>t.goal===gid&&t.t).map(t=>({d,...t})))}
/* ---------- Ziele: SMART + WOOP, Fortschritt, Zeitstrahl ---------- */
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const fmtNum=n=>Number(n||0).toLocaleString('de-DE');
function goalMonths(g){if(!g.start||!g.deadline)return[];const out=[];let d=new Date(g.start.slice(0,7)+'-01T12:00');const end=new Date(g.deadline.slice(0,7)+'-01T12:00');let guard=0;
  while(d<=end&&guard++<60){out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));d.setMonth(d.getMonth()+1)}return out}
const monLabel=k=>MON[+k.slice(5)-1]+' '+k.slice(2,4);
const curMonth=()=>today().slice(0,7);
function measurable(g){return !!(g.metric&&+g.target)}
function goalProgress(g){
  if(measurable(g)&&g.rhythm==='monat'){const ms=goalMonths(g);if(!ms.length)return 0;return Math.round(ms.filter(m=>+(g.months||{})[m]>=+g.target).length/ms.length*100)}
  if(measurable(g))return Math.min(100,Math.round((+g.current||0)/(+g.target)*100));
  return g.progress||0;
}
function timeStatus(g){
  if(!g.start||!g.deadline)return '';
  const t=today();
  if(t<g.start){const n=Math.ceil((new Date(g.start+'T12:00')-new Date(t+'T12:00'))/864e5);return `Startet in ${n} ${n===1?'Tag':'Tagen'} (${new Date(g.start+'T12:00').toLocaleDateString('de-DE')})`}
  if(t>g.deadline)return 'Zeitraum abgeschlossen';
  const ms=goalMonths(g);const i=ms.indexOf(curMonth());
  let s=ms.length>1&&i>=0?`Monat ${i+1} von ${ms.length}`:'';
  const left=Math.ceil((new Date(g.deadline+'T12:00')-new Date(t+'T12:00'))/864e5);s+=(s?' · ':'')+`noch ${left} Tage`;
  if(measurable(g)&&g.rhythm==='monat'){const v=(g.months||{})[curMonth()];s+=` · ${MON[+curMonth().slice(5)-1]}: ${fmtNum(v||0)} / ${fmtNum(g.target)} ${esc(g.unit||'')}`}
  return s;
}
function timePct(g){if(!g.start||!g.deadline)return 0;const a=new Date(g.start+'T12:00'),b=new Date(g.deadline+'T12:00'),n=new Date(today()+'T12:00');return Math.max(0,Math.min(100,(n-a)/(b-a)*100))}
const visionLines=g=>(g.vision||'').split('\n').map(x=>x.trim()).filter(Boolean);

function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function goalTimeline(){
  const G=S.goals.filter(g=>g.start&&g.deadline);
  if(!G.length)return `<div class="card"><p class="empty">Gib deinen Zielen über „Bearbeiten“ einen Start und ein Ende – dann erscheinen sie hier.</p></div>`;
  const scale='monat';
  let a=G.map(g=>g.start).concat(today()).sort()[0],b=G.map(g=>g.deadline).sort().slice(-1)[0];
  // Spalten bauen
  let cols=[],A,B;
  if(scale==='kw'){
    const s0=new Date(a+'T12:00');s0.setDate(s0.getDate()-((s0.getDay()+6)%7));A=new Date(iso(s0)+'T00:00');
    const e0=new Date(b+'T12:00');let d=new Date(A);while(d<=e0||cols.length<12){cols.push({k:iso(d),l:'KW '+isoWeek(d)});d.setDate(d.getDate()+7)}
    B=new Date(d);
  }else{
    const ms=goalMonths({start:a.slice(0,7)+'-01',deadline:b});while(ms.length<6){const d=new Date(ms[ms.length-1]+'-01T12:00');d.setMonth(d.getMonth()+1);ms.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
    cols=ms.map(m=>({k:m,l:monLabel(m)}));A=new Date(ms[0]+'-01T00:00');B=new Date(ms[ms.length-1]+'-01T00:00');B.setMonth(B.getMonth()+1);
  }
  const span=B-A,pos=ds=>Math.max(0,Math.min(100,(new Date(ds+'T12:00')-A)/span*100));
  const every=scale==='kw'?(cols.length>30?4:cols.length>16?2:1):1;
  const sorted=[...G].sort((x,y)=>(y.master?1:0)-(x.master?1:0));
  const grid=`background-size:${100/cols.length}% 100%`;
  return `<div class="card gt">
    <div class="gt-inner">
    <div class="gt-head"><div></div><div class="gt-months">${cols.map((c,i)=>`<span>${i%every===0?c.l:''}</span>`).join('')}</div></div>
    ${sorted.map(g=>{const l=pos(g.start),r=pos(g.deadline);const segs=measurable(g)&&g.rhythm==='monat'?goalMonths(g):[];
      return `<div class="gt-row ${g.master?'master':''}"><div class="gt-label" title="${esc(g.title)}">${esc(g.title)}</div>
      <div class="gt-track" style="${grid}"><div class="gt-bar" style="left:${l}%;width:${Math.max(1.5,r-l)}%">${segs.length?segs.map(m=>{const v=(g.months||{})[m];const st=v==null||v===''?(m<curMonth()?'miss':'open'):(+v>=+g.target?'met':'miss');return `<i class="${st}" title="${monLabel(m)}: ${v==null||v===''?'–':fmtNum(v)+' '+esc(g.unit||'')}"></i>`}).join(''):`<i class="fill" style="flex:none;width:${goalProgress(g)}%"></i>`}</div>
      <div class="gt-today" style="left:${pos(today())}%"></div></div><div class="gt-pct">${goalProgress(g)} %</div></div>`}).join('')}
    </div>
    <div class="gt-legend"><span><i class="met"></i>erreicht</span><span><i class="miss"></i>verfehlt</span><span><i class="open"></i>offen</span><span><i class="today"></i>Heute</span></div>
  </div>`;
}
function goalCard(g,big){
  const st=goalSteps(g.id),done=st.filter(t=>t.done),p=goalProgress(g),ms=goalMonths(g);
  if(!editing.ziele){
    const monthly=measurable(g)&&g.rhythm==='monat';
    const fd=x=>new Date(x+'T12:00').toLocaleDateString('de-DE');
    const sec=(h,body)=>body?`<div class="gsec"><div class="gh">${h}</div>${body}</div>`:'';
    return `<div class="card ${big?'mission':''} goal-view" style="${big?'margin:0':''}">
      ${big?'<span class="label" style="display:block">Mein Masterziel</span>':''}

      <div class="gsplit">
        ${sec('Messgröße',measurable(g)?`${esc(g.metric)}: <b>${fmtNum(g.target)} ${esc(g.unit||'')}</b>${monthly?' pro Monat':''}`:'')}
        ${sec('Zeitraum',g.start&&g.deadline?`${fd(g.start)} – ${fd(g.deadline)}`:g.deadline?`bis ${fd(g.deadline)}`:'')}
      </div>
      ${sec('Warum',g.why?esc(g.why):'')}
      ${sec('Das gewinne ich, wenn ich dranbleibe',visionLines(g).length?`<ul>${visionLines(g).map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'')}
      ${sec('Zielerreichung',`<div class="bar" style="margin:4px 0 6px"><i style="width:${p}%"></i></div>
        <div style="font-size:13.5px;opacity:.8">${p} % erreicht · ${done.length} Aufgaben in den letzten 30 Tagen erledigt</div>
        ${monthly&&ms.length?`<div class="months" style="margin-top:10px">${ms.map(m=>{const v=(g.months||{})[m];const fut=m>curMonth();return `<label class="mcell ${v!=null&&v!==''?(+v>=+g.target?'met':'miss'):''}"><span>${monLabel(m)}</span><input type="number" inputmode="decimal" data-mv="${g.id}|${m}" value="${v??''}" placeholder="${fut?'–':'?'}" ${fut?'disabled':''}></label>`}).join('')}</div><div style="font-size:12.5px;opacity:.6;margin-top:6px">Am Monatsende Ergebnis eintragen (${esc(g.unit||'')}).</div>`:''}
        ${measurable(g)&&!monthly?`<div class="row" style="margin:8px 0 0"><span style="font-size:13px;opacity:.8">Aktueller Stand</span><input type="number" data-cur="${g.id}" value="${g.current??''}" style="width:120px"><span style="font-size:13px;opacity:.8">/ ${fmtNum(g.target)} ${esc(g.unit||'')}</span></div>`:''}`)}
      ${sec('Was mich abhält',g.obstacle?esc(g.obstacle):'')}
      ${sec('Mein Plan',g.plan?esc(g.plan):'')}
    </div>`;
  }
  const f=(k,ph,extra='')=>`<input type="text" data-f="${g.id}|${k}" value="${esc(g[k]??'')}" placeholder="${ph}" ${extra}>`;
  return `<div class="card goal-edit" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">${big?'Masterziel':'Optionales Ziel'}</span><button class="x" data-del="${g.id}" title="Löschen">×</button></div>
    <div><label class="l">S – Was genau will ich erreichen?</label>${f('title','z. B. Trading: konstant monatlich auszahlen')}</div>
    <div><label class="l">M – Woran messe ich es?</label>
      <div class="row" style="flex-wrap:wrap;margin:0">${f('metric','z. B. Auszahlung (17 Konten)','style="flex:2;min-width:160px"')}
        <input type="number" data-f="${g.id}|target" value="${esc(g.target??'')}" placeholder="Zielwert" style="width:110px">
        ${f('unit','$ / € / kg / km','style="width:90px"')}
        <select data-f="${g.id}|rhythm" style="width:130px"><option value="monat" ${g.rhythm==='monat'?'selected':''}>pro Monat</option><option value="gesamt" ${g.rhythm!=='monat'?'selected':''}>insgesamt</option></select></div>
      ${!measurable(g)?`<div class="row" style="margin:8px 0 0"><span class="meta">Nicht messbar? Fortschritt per Hand:</span><input type="range" min="0" max="100" step="5" value="${g.progress||0}" data-g="${g.id}" style="flex:1"><span class="meta" id="p-${g.id}">${g.progress||0} %</span></div>`:''}</div>
    <div><label class="l">A/R – Warum ist mir das wichtig?</label>${f('why','z. B. Freiheit über meine Zeit')}</div>
    ${big?`<div><label class="l">Das gewinne ich, wenn ich dranbleibe: <span class="meta">(eine Zeile pro Punkt)</span></label><textarea data-f="${g.id}|vision" placeholder="z. B. Ich bestimme selbst über meine Zeit …">${esc(g.vision||'')}</textarea></div>`:''}
    <div><label class="l">T – Zeitraum</label><div class="row" style="margin:0;flex-wrap:wrap"><span class="meta">von</span><input type="date" data-f="${g.id}|start" value="${esc(g.start||'')}" style="width:auto"><span class="meta">bis</span><input type="date" data-f="${g.id}|deadline" value="${esc(g.deadline||'')}" style="width:auto"></div></div>
    <div class="woop-edit"><label class="l">Was wird mich am ehesten davon abhalten?</label>${f('obstacle','z. B. Abends Bier und Shorts – am nächsten Morgen unkonzentriert')}
      <label class="l" style="margin-top:10px">Wenn-dann-Plan</label>${f('plan','Wenn … dann … – z. B. Wenn ich abends Lust auf Bier habe, trinke ich Alkoholfreies und lege das Handy in die Küche.')}</div>
    ${!big?`<button class="btn ghost small" data-master="${g.id}" style="align-self:flex-start">Zum Masterziel machen</button>`:''}
  </div>`;
}
function viewZiele(){
  const m=masterGoal(),opt=S.goals.filter(g=>g!==m);
  M.innerHTML=`
  <div class="section-head"><div><h1>Meine Ziele</h1><p>Ein Ziel, das alles verändert. Dazu höchstens zwei, die es tragen.</p></div>${editBtn('ziele')}</div>
  ${editing.ziele?`<p class="info-msg" style="margin:-6px 0 18px">Formuliere jedes Ziel nach <b>SMART</b> (spezifisch, messbar, attraktiv, realistisch, terminiert) – und ergänze ein <b>Hindernis mit Wenn-dann-Plan</b>. Diese Kombination ist wissenschaftlich am besten belegt.</p>`:''}
  ${fold('ziele:master','Mein Masterziel',m?`${esc(m.title)} · ${goalProgress(m)} %`:'noch keins',
     m?goalCard(m,true).replace('<span class="label" style="display:block">Mein Masterziel</span>',''):'<div class="card">Noch kein Masterziel – leg über „Bearbeiten“ eins an.</div>')}
  ${fold('ziele:optional',`Optionale Ziele <small>${opt.length}/2</small>`,opt.map(g=>`${esc(g.title)} ${goalProgress(g)} %`).join(' · ')||'keine',
    `${opt.length>2?`<p class="slip-msg" style="margin:0 0 16px">Du hast ${opt.length} optionale Ziele. Jedes weitere Ziel zieht Energie von deinem Masterziel ab – überleg, welches du parken kannst.</p>`:''}
    <div class="grid">${opt.map(g=>goalCard(g,false)).join('')}
    ${!editing.ziele&&!opt.length?'<p class="empty">Noch keine optionalen Ziele – über „Bearbeiten“ anlegen.</p>':''}
    ${editing.ziele?`<div class="card">
      <h3>${m?'Neues optionales Ziel':'Masterziel anlegen'}</h3><p class="hint">${opt.length>=2&&m?'Du hast schon 2 optionale Ziele. Brauchst du wirklich ein drittes?':'Titel eingeben – den Rest füllst du danach in der Karte aus.'}</p>
      <input type="text" id="gT" placeholder="z. B. Gesund ernähren" style="margin-bottom:12px">
      <button class="btn" id="gAdd">Ziel hinzufügen</button>
    </div>`:''}
    </div>`,true,'Empfehlung: höchstens 2 – Fokus schlägt Vielfalt')}
  ${fold('ziele:zeitstrahl','Zeitstrahl',(()=>{const G=S.goals.filter(g=>g.start&&g.deadline);if(!G.length)return 'noch keine Zeiträume';const a=G.map(g=>g.start).sort()[0],b=G.map(g=>g.deadline).sort().slice(-1)[0];return monLabel(a.slice(0,7))+' – '+monLabel(b.slice(0,7))})(),goalTimeline(),true,'Alle Ziele im Zeitverlauf')}
`;
  bindEdit('ziele',viewZiele);bindFolds(viewZiele);
  if(editing.ziele&&M.querySelector('#gAdd'))M.querySelector('#gAdd').onclick=()=>{const t=M.querySelector('#gT').value.trim();if(!t)return;
    S.goals.push({id:uid(),master:!S.goals.length,title:t,why:'',start:today(),deadline:'',progress:0,rhythm:'gesamt',months:{}});markMeta();viewZiele()};
  bind('[data-f]',el=>{const [id,k]=el.dataset.f.split('|');const g=goalById(id);g[k]=el.type==='number'?(el.value===''?'':+el.value):el.value;markMeta();if(el.tagName==='SELECT'||el.type==='date'||k==='target'||k==='metric')viewZiele()},'change');
  bind('input[data-f],textarea[data-f]',el=>{const [id,k]=el.dataset.f.split('|');if(el.type==='date'||el.type==='number')return;goalById(id)[k]=el.value;markMeta()});
  bind('[data-g]',el=>{const g=goalById(el.dataset.g);g.progress=+el.value;const p=M.querySelector('#p-'+g.id);if(p)p.textContent=g.progress+' %';markMeta()});
  bind('[data-mv]',el=>{const [id,mo]=el.dataset.mv.split('|');const g=goalById(id);g.months=g.months||{};if(el.value==='')delete g.months[mo];else g.months[mo]=+el.value;markMeta();viewZiele()},'change');
  bind('[data-cur]',el=>{const g=goalById(el.dataset.cur);g.current=el.value===''?'':+el.value;markMeta();viewZiele()},'change');
  bind('[data-master]',el=>{S.goals.forEach(g=>g.master=g.id===el.dataset.master);markMeta();toast('Neues Masterziel gesetzt.');viewZiele()},'click');

  bind('[data-del]',el=>{const g=goalById(el.dataset.del);S.goals=S.goals.filter(x=>x!==g);if(g.master&&S.goals[0])S.goals[0].master=true;markMeta();viewZiele()},'click');
}

   Mein idealer Tag
   ========================================================= */
const hm=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m};
function idealSorted(){return [...S.idealDay].sort((a,b)=>(hm(a.time)??9999)-(hm(b.time)??9999))}
function idealNow(){const n=new Date(),cur=n.getHours()*60+n.getMinutes(),L=idealSorted().filter(x=>x.time);let now=null,next=null;
  L.forEach((x,i)=>{const st=hm(x.time),en=x.end?hm(x.end):(L[i+1]?hm(L[i+1].time):st+60);if(cur>=st&&cur<en)now=x;if(st>cur&&!next)next=x});return{now,next}}
function viewIdeal(){
  const {now}=idealNow();
  if(!editing.ideal){
    const L=idealSorted(),cur=new Date().getHours()*60+new Date().getMinutes();
    M.innerHTML=`
    <div class="section-head"><div><h1>Mein idealer Tag</h1><p>So sieht der Tag aus, für den ich arbeite – jeden Tag.</p></div>${editBtn('ideal')}</div>
    ${S.idealWhy?`<div class="manifest">„${esc(S.idealWhy)}“</div>`:''}
    <div class="card"><div class="timeline">${L.map(x=>{const isNow=now&&now.id===x.id,past=!isNow&&hm(x.end||x.time)<cur;
      return `<div class="tl-row ${isNow?'now':''} ${past?'past':''}"><div class="tl-time">${esc(x.time)}${x.end?`<small>bis ${esc(x.end)}</small>`:''}</div><div class="tl-rail"><i></i></div><div class="tl-title">${esc(x.title)}${isNow?' <span class="tag" style="margin-left:6px">Jetzt</span>':''}</div></div>`}).join('')||'<p class="empty">Noch leer – über „Bearbeiten“ deinen idealen Tag anlegen.</p>'}</div></div>`;
    bindEdit('ideal',viewIdeal);return;
  }
  M.innerHTML=`
  <div class="section-head"><div><h1>Mein idealer Tag</h1><p>So sieht der Tag aus, für den ich arbeite – jeden Tag.</p></div>${editBtn('ideal')}</div>
  <div class="card" style="margin-bottom:20px">
    <h3>Warum dieser Tag?</h3><p class="hint">Wenn du jeden Tag so leben könntest – was hätte sich in deinem Leben verändert?</p>
    <textarea id="iWhy" placeholder="z. B. Ich bin frei in meiner Zeiteinteilung, verdiene mein Geld mit Trading und habe morgens Zeit für mich und meine Familie.">${esc(S.idealWhy)}</textarea>
  </div>
  <div class="card">
    <h3>Mein Tagesablauf</h3><p class="hint">Uhrzeit und was du tust. Die Liste sortiert sich selbst.</p>
    <div style="display:flex;flex-direction:column;gap:4px">
    ${idealSorted().map(x=>`<div class="row" style="margin:0;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap;${now&&now.id===x.id?'background:var(--accent-soft);border-radius:6px':''}">
      <input type="time" data-it="${x.id}" value="${esc(x.time)}" style="width:118px">
      <span class="meta">bis</span><input type="time" data-ie="${x.id}" value="${esc(x.end)}" style="width:118px">
      <input type="text" data-ix="${x.id}" value="${esc(x.title)}" placeholder="Was mache ich?" style="flex:1;min-width:160px">
      ${now&&now.id===x.id?'<span class="tag">Jetzt</span>':''}
      <button class="x" data-idel="${x.id}">×</button></div>`).join('')}
    </div>
    <div class="row" style="margin-top:14px;flex-wrap:wrap">
      <input type="time" id="nT" style="width:118px"><span class="meta">bis</span><input type="time" id="nE" style="width:118px">
      <input type="text" id="nX" placeholder="z. B. Laufen, Familienzeit, Handy aus …" style="flex:1;min-width:160px">
      <button class="btn" id="iAdd">+</button>
    </div>
  </div>`;
  bindEdit('ideal',viewIdeal);
  bind('#iWhy',el=>{S.idealWhy=el.value;markMeta()});
  bind('[data-it]',el=>{S.idealDay.find(x=>x.id===el.dataset.it).time=el.value;markMeta()},'change');
  bind('[data-ie]',el=>{S.idealDay.find(x=>x.id===el.dataset.ie).end=el.value;markMeta()},'change');
  bind('[data-ix]',el=>{S.idealDay.find(x=>x.id===el.dataset.ix).title=el.value;markMeta()});
  bind('[data-idel]',el=>{S.idealDay=S.idealDay.filter(x=>x.id!==el.dataset.idel);markMeta();viewIdeal()},'click');
  M.querySelector('#iAdd').onclick=()=>{const t=M.querySelector('#nT').value,x=M.querySelector('#nX').value.trim();if(!t||!x){toast('Uhrzeit und Tätigkeit eintragen.');return}
    S.idealDay.push({id:uid(),time:t,end:M.querySelector('#nE').value,title:x});markMeta();viewIdeal()};
}

function uiOpen(k,def){const u=(S.settings&&S.settings.ui)||{};return u[k]!==undefined?u[k]:def}
function setUi(k,v){S.settings.ui=S.settings.ui||{};const t=today();Object.keys(S.settings.ui).forEach(x=>{const m=x.match(/^abschluss:(\d{4}-\d{2}-\d{2})$/);if(m&&m[1]<t)delete S.settings.ui[x]});S.settings.ui[k]=v;markMeta()}
function fold(k,title,sum,body,def=true,sub=''){const open=uiOpen(k,def);return `<section class="fold ${open?'open':''}"><button class="fold-head" data-fold="${k}"><span class="t">${title}</span><span class="sum">${open?sub:sum}</span><span class="chev">▾</span></button>${open?`<div class="fold-body">${body}</div>`:''}</section>`}
function bindFolds(fn){M.querySelectorAll('[data-fold]').forEach(b=>b.onclick=()=>{setUi(b.dataset.fold,!b.parentElement.classList.contains('open'));fn()})}
